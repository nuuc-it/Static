<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDocs — Catalog</title>
<link rel="stylesheet" href="app/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main id="main">
  <div class="page-header">
    <div>
      <div class="eyebrow">Document library</div>
      <h1>Catalog</h1>
      <p>Find current Northlake practices, guides, policies, and team-owned resources.</p>
    </div>
    <div class="button-row">
      <button id="ndocs-add-toggle" type="button" class="button--soft" aria-expanded="false" aria-controls="ndocs-add-panel">+ Add document to the catalog</button>
    </div>
  </div>

  <section id="ndocs-add-panel" class="add-document-panel" aria-labelledby="ndocs-add-heading" hidden>
    <div class="add-document-panel__header">
      <div>
        <h2 id="ndocs-add-heading">Add document to the catalog</h2>
        <p>Paste a Google Drive link, or drop the link into the box below.</p>
      </div>
      <button id="ndocs-add-close" type="button" class="button--quiet">Close</button>
    </div>
    <div class="add-document-panel__body"></div>
  </section>

  <section class="search-shell" aria-labelledby="ndocs-search-heading">
    <h2 id="ndocs-search-heading" class="sr-only">Search</h2>
    <form id="ndocs-search-form" class="search-form" role="search">
      <label class="sr-only" for="ndocs-search-q">Search the catalog</label>
      <input id="ndocs-search-q" name="q" type="search" placeholder="Search titles, purpose, audience, or team…" autocomplete="off">
      <button type="submit" class="button--primary">Search</button>
    </form>
    <fieldset class="filters">
      <legend class="sr-only">Filters</legend>
      <div class="filter-grid">
        <div class="field">
          <label for="ndocs-filter-team">Team</label>
          <select id="ndocs-filter-team"><option value="">All teams</option></select>
        </div>
        <div class="field">
          <label for="ndocs-filter-type">Type</label>
          <select id="ndocs-filter-type"><option value="">All types</option></select>
        </div>
        <div class="field">
          <label for="ndocs-filter-audience">Audience</label>
          <select id="ndocs-filter-audience"><option value="">All audiences</option></select>
        </div>
        <div class="field">
          <label for="ndocs-filter-status">Status</label>
          <select id="ndocs-filter-status">
            <option value="">Current</option>
            <option value="all">All statuses</option>
            <option value="retired">Retired</option>
          </select>
        </div>
      </div>
    </fieldset>
    <p id="ndocs-search-status" class="meta" role="status" aria-live="polite"></p>
  </section>

  <section class="section-card" aria-labelledby="ndocs-results-heading">
    <div class="section-card-header">
      <div>
        <div class="section-kicker">Search results</div>
        <h2 id="ndocs-results-heading">Resources</h2>
      </div>
    </div>
    <div id="ndocs-results" class="section-card-body" aria-live="polite" aria-busy="true"></div>
  </section>
</main>

<script>

// publish. Left null in the unbuilt source, same convention as static-src/index.html.
var STATIC_BUILD_VERSION_ = "0.0.0.39";

var STATIC_ENV_LABEL_ = "SIT";
var STATIC_BUILD_ENV_ = "test";
var STATIC_DISPATCH_URL_ = "https://script.google.com/macros/s/AKfycbwmoOPRDThQWDzMPU5H-6aVzvnprYbIL8yjbhLX3wBbi89ZY7cRLc2_yoYUK1H8LcX3/exec";
var STATIC_GIS_CLIENT_ID_ = "657771271619-8ebgf03k3rp872vlib3ibsktl9sk4ig1.apps.googleusercontent.com";
</script>
<!-- Shared front-end modules (this project's CLAUDE.md "reuse, do not re-derive"). No
     page-local <style> or scaffolding: app/shell.js owns the shell (ADR-0012, NDocs-3il). -->
<script src="app/config.js"></script>
<script src="app/ui.js"></script>
<script src="app/session.js"></script>
<script src="app/transport.js"></script>
<script src="app/shell.js"></script>
<script src="app/vocab.js"></script>
<script src="app/records.js"></script>
<script src="app/drop-register.js"></script>
<!-- page-search.js defines window.NDocsPageSearch before the mount call below runs it. -->
<script src="app/page-search.js"></script>
<script>
(function () {
  'use strict';
  NDocsShell.mount({
    activePage: 'catalog',
    pageContent: document.getElementById('main'),
    onEnter: window.NDocsPageSearch.start
  });
})();
</script>
</body>
</html>
