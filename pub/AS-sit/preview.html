<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Opening document preview — NUUC Action Sheet</title>
<script>
// NT-71y.12: portal-side bounce for the chip link (cmd=preview). Signed in -> portal index; else -> web-app preview notice.
// Stamped per build by scripts/portal-static.js (STAMPED_PAGES). gas-static requires every stamp placeholder
// on every stamped page; this page uses only STATIC_WEBAPP_URL_ and STATIC_ASSERTION_AUD_.
var STATIC_BUILD_VERSION_ = "0.1.23.27";
var STATIC_WEBAPP_URL_ = "https://script.google.com/macros/s/AKfycbz8nzjLoXeQ5se40W-FCIwrKDdOOeJhWYLDZVH0RQEZJOxNTeNYSLFsTfFFMO5LLnb9/exec";
var STATIC_ENV_LABEL_ = "SIT";
var STATIC_ASSERTION_AUD_ = "nuuts-shell-test";
var STATIC_DISPATCH_URL_ = "https://script.google.com/macros/s/AKfycbwmoOPRDThQWDzMPU5H-6aVzvnprYbIL8yjbhLX3wBbi89ZY7cRLc2_yoYUK1H8LcX3/exec";

// Sign-in check duplicates index.html loadCachedAuth (key, numeric exp, 300 s renew skew); keep the two in step.
const STORAGE_SCOPE_ = STATIC_ASSERTION_AUD_ ? ':' + STATIC_ASSERTION_AUD_ : '';
const AUTH_STORAGE_KEY = 'nuucAsAuth.v1' + STORAGE_SCOPE_;
const AUTH_RENEW_SKEW_SECONDS = 300;

function isSignedIn_(){
  try {
    const cached = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
    if (!cached || typeof cached.exp !== 'number') return false;
    return Math.floor(Date.now() / 1000) < cached.exp - AUTH_RENEW_SKEW_SECONDS;
  } catch (e) { return false; }
}

(function(){
  const search = location.search;
  if (!search || search === '?') { location.replace('index.html'); return; }
  const q = new URLSearchParams(search);
  const docId = q.get('docId');
  const ain = q.get('ain');
  if (docId && isSignedIn_()) {
    location.replace('index.html?doc=' + encodeURIComponent(docId) + (ain ? '&action=' + encodeURIComponent(ain) : ''));
    return;
  }
  location.replace(STATIC_WEBAPP_URL_ ? STATIC_WEBAPP_URL_ + search : 'index.html' + search);
})();
</script>
</head>
<body>
<noscript><p><a href="index.html">Open the team portal</a></p></noscript>
</body>
</html>
