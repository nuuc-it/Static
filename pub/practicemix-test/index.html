<script>
/**
 * Audio Engine - Web Audio API Mixer
 *
 * Copyright (c) 2026 Stuart Donaldson. Licensed under MIT License.
 *
 * This module handles all audio processing including:
 * - Loading and decoding audio files
 * - Building the mixer signal chain
 * - Real-time preview playback
 * - Offline rendering for export
 */

const AudioEngine = (() => {
  'use strict';

  // Private state
  let audioContext = null;
  let offlineContext = null;
  
  // Track data
  const tracks = new Map(); // Map<trackId, { buffer, sourceNode, gainNodes, etc. }>
  
  // Mixer nodes
  let masterGain = null;
  let masterPan = 0; // -1 (full left) to 1 (full right)
  let leftPanGain = null;
  let rightPanGain = null;
  let limiter = null;
  let leftBus = null;
  let rightBus = null;
  let merger = null;
  
  // Playback state
  let isPlaying = false;
  let isPaused = false;
  let startTime = 0;
  let pauseTime = 0;
  let playbackStartedAt = 0;
  let playbackRate = 1.0;

  // Cache of pre-stretched buffers: Map<trackId, Map<rate, AudioBuffer>>
  const stretchedBufferCache = new Map();
  
  // Callbacks
  let onTimeUpdate = null;
  let onPlaybackEnd = null;
  let onTrackLoaded = null;
  let onLevelUpdate = null;
  
  // Level metering
  let analyserLeft = null;
  let analyserRight = null;
  let levelAnimationId = null;
  let mixOverviewCache = null;

  // Pre-allocated RMS buffers — reused each meter update to avoid GC pressure.
  // Keyed by analyser node; populated lazily on first use.
  const _rmsBuffers = new WeakMap();
  const _trackMeterSmooth = new Map();
  let _masterMeterSmooth = { left: 0, right: 0 };

  // Cached solo state — updated in setTrackSolo so updateTrackGains
  // never has to scan the full track list on every slider event.
  let _soloCount = 0;
  
  // Animation frame for time updates
  let animationFrameId = null;

  // =========================================
  // Initialization
  // =========================================

  /**
   * Initializes the AudioContext (requires user gesture).
   * @returns {Promise<boolean>} True if successful
   */
  async function init() {
    if (audioContext && audioContext.state !== 'closed') {
      // Resume if suspended
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      return true;
    }
    
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      // Create master chain
      createMasterChain();
      
      console.log('AudioEngine initialized. Sample rate:', audioContext.sampleRate);
      return true;
    } catch (e) {
      console.error('Failed to initialize AudioContext:', e);
      return false;
    }
  }

  /**
   * Creates the master output chain with limiter.
   */
  function createMasterChain() {
    // Create channel merger (2 inputs → stereo output)
    merger = audioContext.createChannelMerger(2);
    
    // Create gain nodes for L/R buses
    leftBus = audioContext.createGain();
    rightBus = audioContext.createGain();
    
    // Create pan gain nodes
    leftPanGain = audioContext.createGain();
    rightPanGain = audioContext.createGain();
    
    console.log('Created pan gain nodes');
    
    // Set initial pan values (center)
    updatePanGains();
    
    // Connect L/R buses to pan gains
    leftBus.connect(leftPanGain);
    rightBus.connect(rightPanGain);
    
    // Connect pan gains to merger
    leftPanGain.connect(merger, 0, 0);  // Left pan → Left channel
    rightPanGain.connect(merger, 0, 1); // Right pan → Right channel
    
    // Create limiter (prevents clipping during preview)
    limiter = audioContext.createDynamicsCompressor();
    limiter.threshold.value = -1;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;
    limiter.release.value = 0.1;
    
    // Create master gain
    masterGain = audioContext.createGain();
    masterGain.gain.value = 1.0;
    
    // Create analysers for level metering
    analyserLeft = audioContext.createAnalyser();
    analyserRight = audioContext.createAnalyser();
    analyserLeft.fftSize = 512;
    analyserRight.fftSize = 512;
    
    // Create splitter after master for metering
    const meterSplitter = audioContext.createChannelSplitter(2);
    
    // Connect: Merger → Limiter → Master Gain → Splitter → Analysers
    merger.connect(limiter);
    limiter.connect(masterGain);
    masterGain.connect(meterSplitter);
    meterSplitter.connect(analyserLeft, 0);
    meterSplitter.connect(analyserRight, 1);
    masterGain.connect(audioContext.destination);
  }

  function invalidateMixOverviewCache() {
    mixOverviewCache = null;
  }

  // =========================================
  // Track Loading
  // =========================================

  /**
   * Loads an audio track from a base64 data URI.
   * @param {string} trackId - Unique identifier for the track
   * @param {string} dataUri - Base64 data URI of the audio file
   * @param {string} name - Display name of the track
   * @returns {Promise<Object>} Track info { duration, channels, sampleRate }
   */
  async function loadTrack(trackId, dataUri, name) {
    await init();
    
    try {
      // Convert data URI to ArrayBuffer
      const response = await fetch(dataUri);
      const arrayBuffer = await response.arrayBuffer();
      
      // Decode audio data
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
      
      // Convert to stereo if mono
      const stereoBuffer = ensureStereo(audioBuffer);
      
      // Store track data
      tracks.set(trackId, {
        id: trackId,
        name: name,
        buffer: stereoBuffer,
        duration: stereoBuffer.duration,
        channels: stereoBuffer.numberOfChannels,
        sampleRate: stereoBuffer.sampleRate,
        pan: 0.0,      // -1 (full left) to 1 (full right)
        level: 1.0,    // 0 to 2 (overall volume)
        muted: false,
        solo: false,
        sourceNode: null,
        leftGainNode: null,
        rightGainNode: null,
        meterAnalyserLeft: null,
        meterAnalyserRight: null
      });

      invalidateMixOverviewCache();

      invalidateMixOverviewCache();

      const trackInfo = {
        id: trackId,
        name: name,
        duration: stereoBuffer.duration,
        durationFormatted: formatTime(stereoBuffer.duration),
        channels: stereoBuffer.numberOfChannels,
        sampleRate: stereoBuffer.sampleRate
      };
      
      if (onTrackLoaded) {
        onTrackLoaded(trackInfo);
      }
      
      return trackInfo;
      
    } catch (e) {
      console.error('Failed to load track:', name, e);
      throw new Error(`Failed to decode "${name}": ${e.message}`);
    }
  }

  /**
   * Loads an audio track from a pre-fetched ArrayBuffer.
   * Used by the direct Drive fetch spike to skip the base64 round-trip.
   * @param {string} trackId
   * @param {ArrayBuffer} arrayBuffer - Raw audio bytes
   * @param {string} name - Display name
   * @returns {Promise<Object>} Track info
   */
  async function loadTrackFromBuffer(trackId, arrayBuffer, name) {
    await init();
    try {
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
      const stereoBuffer = ensureStereo(audioBuffer);
      tracks.set(trackId, {
        id: trackId, name: name, buffer: stereoBuffer,
        duration: stereoBuffer.duration, channels: stereoBuffer.numberOfChannels,
        sampleRate: stereoBuffer.sampleRate,
        pan: 0.0, level: 1.0, muted: false, solo: false,
        sourceNode: null, leftGainNode: null, rightGainNode: null,
        meterAnalyserLeft: null, meterAnalyserRight: null
      });
      const trackInfo = {
        id: trackId, name: name,
        duration: stereoBuffer.duration,
        durationFormatted: formatTime(stereoBuffer.duration),
        channels: stereoBuffer.numberOfChannels, sampleRate: stereoBuffer.sampleRate
      };
      if (onTrackLoaded) onTrackLoaded(trackInfo);
      return trackInfo;
    } catch (e) {
      console.error('Failed to decode track:', name, e);
      throw new Error(`Failed to decode "${name}": ${e.message}`);
    }
  }

  /**
   * Ensures an AudioBuffer is stereo (2 channels).
   * @param {AudioBuffer} buffer - Input buffer
   * @returns {AudioBuffer} Stereo buffer
   */
  function ensureStereo(buffer) {
    if (buffer.numberOfChannels === 2) {
      return buffer;
    }
    
    // Create stereo buffer
    const stereoBuffer = audioContext.createBuffer(
      2,
      buffer.length,
      buffer.sampleRate
    );
    
    // Copy mono to both channels
    const monoData = buffer.getChannelData(0);
    stereoBuffer.copyToChannel(monoData, 0);
    stereoBuffer.copyToChannel(monoData, 1);
    
    console.log('Converted mono to stereo');
    return stereoBuffer;
  }

  /**
   * Normalizes all track buffers to the same length (pads shorter tracks).
   */
  function normalizeTrackLengths() {
    const trackArray = Array.from(tracks.values());
    if (trackArray.length === 0) return;
    
    const maxLength = Math.max(...trackArray.map(t => t.buffer.length));
    const sampleRate = trackArray[0].buffer.sampleRate;
    
    trackArray.forEach(track => {
      if (track.buffer.length < maxLength) {
        const paddedBuffer = audioContext.createBuffer(2, maxLength, sampleRate);
        
        for (let ch = 0; ch < 2; ch++) {
          const sourceData = track.buffer.getChannelData(ch);
          const destData = paddedBuffer.getChannelData(ch);
          destData.set(sourceData, 0);
          // Remaining samples are already 0 (silence)
        }
        
        track.buffer = paddedBuffer;
        track.duration = paddedBuffer.duration;
        console.log(`Padded "${track.name}" from ${track.buffer.length} to ${maxLength} samples`);
      }
    });
  }

  /**
   * Removes a track from the engine.
   * @param {string} trackId - Track identifier
   */
  function removeTrack(trackId) {
    const track = tracks.get(trackId);
    if (track) {
      if (track.solo) _soloCount--;
      if (track.sourceNode) {
        try {
          track.sourceNode.stop();
          track.sourceNode.disconnect();
        } catch (e) { /* Ignore */ }
      }
    }
    tracks.delete(trackId);
    _trackMeterSmooth.delete(trackId);
    stretchedBufferCache.delete(trackId);
    invalidateMixOverviewCache();
  }

  /**
   * Clears all loaded tracks.
   */
  function clearAllTracks() {
    stop();
    tracks.forEach((track, id) => removeTrack(id));
    tracks.clear();
    _trackMeterSmooth.clear();
    _masterMeterSmooth = { left: 0, right: 0 };
    stretchedBufferCache.clear();
    invalidateMixOverviewCache();
  }

  // =========================================
  // Gain Control
  // =========================================

  /**
   * Helpers for dB <-> linear gain conversion.
   * Use for perceptual slider mapping: gain = 10^(dB/20)
   */
  function dbToGain(db) {
    return Math.pow(10, db / 20);
  }

  function gainToDb(gain) {
    return 20 * Math.log10(Math.max(1e-8, gain));
  }

  /**
   * Sets the pan for a track.
   * @param {string} trackId - Track identifier
   * @param {number} pan - Pan value (-1 to 1, where -1 is full left, 1 is full right)
   */
  function setTrackPan(trackId, pan) {
    const track = tracks.get(trackId);
    if (!track) return;
    
    track.pan = Math.max(-1, Math.min(1, pan));
    updateTrackGains(track);
    invalidateMixOverviewCache();
  }

  /**
   * Sets the level for a track.
   * @param {string} trackId - Track identifier
   * @param {number} level - Linear gain value (0 to 2). UI should convert from dB to gain.
   */
  function setTrackLevel(trackId, level) {
    const track = tracks.get(trackId);
    if (!track) return;
    
    track.level = Math.max(0, Math.min(2, level));
    updateTrackGains(track);
    invalidateMixOverviewCache();
  }

  /**
   * Sets the master volume.
   * @param {number} volume - Volume (0 to 1)
   */
  function setMasterVolume(volume) {
    if (masterGain) {
      const clampedVolume = Math.max(0, Math.min(1, volume));
      masterGain.gain.setValueAtTime(clampedVolume, audioContext.currentTime);
      invalidateMixOverviewCache();
    }
  }

  /**
   * Sets the master pan.
   * @param {number} pan - Pan value (-1 to 1, where -1 is full left, 1 is full right)
   */
  function setMasterPan(pan) {
    masterPan = Math.max(-1, Math.min(1, pan));
    updatePanGains();
    invalidateMixOverviewCache();
  }

  function updatePanGains() {
    if (!leftPanGain || !rightPanGain) return;
    const leftGain = 1 - Math.max(0, masterPan);
    const rightGain = 1 + Math.min(0, masterPan);
    leftPanGain.gain.setValueAtTime(leftGain, audioContext.currentTime);
    rightPanGain.gain.setValueAtTime(rightGain, audioContext.currentTime);
  }

  /**
   * Toggles mute state for a track.
   * @param {string} trackId - Track identifier
   * @param {boolean} muted - Mute state
   */
  function setTrackMuted(trackId, muted) {
    const track = tracks.get(trackId);
    if (!track) return;
    
    track.muted = muted;
    updateTrackGains(track);
    invalidateMixOverviewCache();
  }

  /**
   * Toggles solo state for a track.
   * @param {string} trackId - Track identifier
   * @param {boolean} solo - Solo state
   */
  function setTrackSolo(trackId, solo) {
    const track = tracks.get(trackId);
    if (!track) return;

    const wasSolo = track.solo;
    track.solo = solo;
    if (solo && !wasSolo) _soloCount++;
    else if (!solo && wasSolo) _soloCount--;

    updateAllTrackGains();
    invalidateMixOverviewCache();
  }

  /**
   * Returns the cached WSOLA-stretched buffer for `track` at the current
   * playbackRate, building and caching it on first use.
   * Returns null when rate is effectively 1.0 (no processing needed).
   */
  function getStretchedBuffer(track) {
    if (Math.abs(playbackRate - 1.0) < 1e-6) return null;

    if (!stretchedBufferCache.has(track.id)) {
      stretchedBufferCache.set(track.id, new Map());
    }
    const byRate = stretchedBufferCache.get(track.id);

    const key = playbackRate.toFixed(1);
    if (byRate.has(key)) return byRate.get(key);

    // Build stretched buffer channel-by-channel
    const src = track.buffer;
    const outLen = Math.round(src.length / playbackRate);
    const outBuf = audioContext.createBuffer(src.numberOfChannels, outLen, src.sampleRate);

    for (let ch = 0; ch < src.numberOfChannels; ch++) {
      const inData  = src.getChannelData(ch);
      const outData = wsola(inData, playbackRate, src.sampleRate);
      outBuf.getChannelData(ch).set(outData);
    }

    byRate.set(key, outBuf);
    return outBuf;
  }

  function setPlaybackRate(rate) {
    playbackRate = Math.max(0.7, Math.min(1.3, rate));
    // Eagerly build and cache stretched buffers for all loaded tracks so play() is instant.
    tracks.forEach(track => getStretchedBuffer(track));

    // Notify UI timing listeners immediately so seek max/time displays stay in sync
    // even before playback starts at the new rate.
    if (onTimeUpdate) {
      onTimeUpdate(getCurrentTime(), getTotalDuration());
    }
  }

  /**
   * Updates gain values for a single track based on pan, level, mute/solo state.
   */
  function updateTrackGains(track) {
    if (!track.leftGainNode || !track.rightGainNode) return;

    const shouldPlay = !track.muted && (!_soloCount || track.solo);
    
    if (shouldPlay) {
      // Calculate left/right gains from pan and level
      // Linear panning: pan = -1 (full left) to 1 (full right)
      const leftPanGain = 1 - Math.max(0, track.pan);
      const rightPanGain = 1 + Math.min(0, track.pan);
      
      const leftValue = leftPanGain * track.level;
      const rightValue = rightPanGain * track.level;
      
      track.leftGainNode.gain.setValueAtTime(leftValue, audioContext.currentTime);
      track.rightGainNode.gain.setValueAtTime(rightValue, audioContext.currentTime);
    } else {
      // Muted or not soloed
      track.leftGainNode.gain.setValueAtTime(0, audioContext.currentTime);
      track.rightGainNode.gain.setValueAtTime(0, audioContext.currentTime);
    }
  }

  /**
   * Updates gain values for all tracks.
   */
  function updateAllTrackGains() {
    tracks.forEach(track => updateTrackGains(track));
  }

  // =========================================
  // Playback Control
  // =========================================

  /**
   * Creates the signal chain for a track.
   * @param {Object} track - Track object
   * @param {AudioContext} ctx - AudioContext to use
   * @param {GainNode} leftBusNode - Left output bus
   * @param {GainNode} rightBusNode - Right output bus
   */
  function createTrackChain(track, ctx, leftBusNode, rightBusNode) {
    // Create source — use pre-stretched buffer so playbackRate stays 1.0 (pitch preserved)
    const source = ctx.createBufferSource();
    source.buffer = getStretchedBuffer(track) || track.buffer;
    
    // Create channel splitter (stereo → 2 mono)
    const splitter = ctx.createChannelSplitter(2);
    
    // Create gain nodes for L/R
    const leftGainNode = ctx.createGain();
    const rightGainNode = ctx.createGain();
    const meterAnalyserLeft = ctx.createAnalyser();
    const meterAnalyserRight = ctx.createAnalyser();
    meterAnalyserLeft.fftSize = 512;
    meterAnalyserRight.fftSize = 512;

    // Connect: Source → Splitter → Gains → Buses + per-track analysers
    source.connect(splitter);
    splitter.connect(leftGainNode, 0);   // Left channel
    splitter.connect(rightGainNode, 1);  // Right channel
    leftGainNode.connect(leftBusNode);
    rightGainNode.connect(rightBusNode);
    leftGainNode.connect(meterAnalyserLeft);
    rightGainNode.connect(meterAnalyserRight);

    // Store references
    track.sourceNode = source;
    track.leftGainNode = leftGainNode;
    track.rightGainNode = rightGainNode;
    track.meterAnalyserLeft = meterAnalyserLeft;
    track.meterAnalyserRight = meterAnalyserRight;
    
    // Apply current gain settings
    updateTrackGains(track);
    
    return source;
  }

  /**
   * Starts playback from the specified time.
   * @param {number} fromTime - Start time in seconds (default 0)
   */
  async function play(fromTime = null) {
    if (!audioContext || tracks.size === 0) return;

    // iOS/Safari: AudioContext starts suspended and resume() must be awaited
    // inside the user-gesture call chain before sources can start.
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }
    
    // Stop existing playback and any running rAF loop
    if (isPlaying) {
      stopTimeUpdateLoop();
      stopSources();
    }
    
    // Determine start position
    if (fromTime !== null) {
      startTime = fromTime;
    } else if (isPaused) {
      startTime = pauseTime;
    } else {
      startTime = 0;
    }
    
    // Normalize track lengths before playback (always normalize to ensure correct length)
    normalizeTrackLengths();
    
    // Create and start sources for each track
    tracks.forEach(track => {
      const source = createTrackChain(track, audioContext, leftBus, rightBus);
      
      // Ensure we don't start past the buffer duration
      const safeStartTime = Math.min(startTime, track.buffer.duration - 0.1);
      if (safeStartTime !== startTime) {
        console.warn(`Track "${track.name}" buffer too short (${track.buffer.duration.toFixed(2)}s), clamping start from ${startTime.toFixed(2)}s to ${safeStartTime.toFixed(2)}s`);
      }
      
      source.start(0, safeStartTime);
      
      // Handle playback end
      source.onended = () => {
        if (isPlaying && track === tracks.values().next().value) {
          handlePlaybackEnd();
        }
      };
    });
    
    // Record when playback started (not adjusted for buffer offset)
    // getCurrentTime will calculate: startTime + elapsed
    playbackStartedAt = audioContext.currentTime;
    isPlaying = true;
    isPaused = false;

    startTimeUpdateLoop();
  }

  /**
   * Pauses playback.
   */
  function pause() {
    if (!isPlaying) return;
    
    pauseTime = getCurrentTime();
    stopSources();
    
    isPlaying = false;
    isPaused = true;

    stopTimeUpdateLoop();
  }

  /**
   * Stops playback and resets to beginning.
   */
  function stop() {
    stopSources();
    
    isPlaying = false;
    isPaused = false;
    startTime = 0;
    pauseTime = 0;
    
    stopTimeUpdateLoop();

    _masterMeterSmooth = { left: 0, right: 0 };
    _trackMeterSmooth.clear();


    if (onTimeUpdate) {
      onTimeUpdate(0, getTotalDuration());
    }
  }

  /**
   * Stops all source nodes.
   */
  function stopSources() {
    tracks.forEach(track => {
      if (track.sourceNode) {
        try {
          // Clear onended handler before stopping to prevent stale events
          track.sourceNode.onended = null;
          track.sourceNode.stop();
          track.sourceNode.disconnect();
        } catch (e) { /* Already stopped */ }
        track.sourceNode = null;
        track.leftGainNode = null;
        track.rightGainNode = null;
        track.meterAnalyserLeft = null;
        track.meterAnalyserRight = null;
      }
    });
  }

  /**
   * Seeks to a specific time.
   * @param {number} time - Time in seconds
   */
  function seek(time) {
    const clampedTime = Math.max(0, Math.min(time, getTotalDuration()));
    const wasPlaying = isPlaying;

    if (wasPlaying) {
      // Set isPlaying false BEFORE stopping sources to prevent onended from triggering handlePlaybackEnd
      isPlaying = false;
      isPaused = false;
      stopSources();
      stopTimeUpdateLoop();
    }

    startTime = clampedTime;
    pauseTime = clampedTime;

    if (wasPlaying) {
      play(clampedTime);
    } else {
      if (onTimeUpdate) {
        onTimeUpdate(clampedTime, getTotalDuration());
      }
    }
  }

  /**
   * Gets the current playback time.
   * @returns {number} Current time in seconds
   */
  function getCurrentTime() {
    if (!isPlaying) {
      return isPaused ? pauseTime : 0;
    }
    const elapsed = audioContext.currentTime - playbackStartedAt;
    return Math.min(startTime + elapsed, getTotalDuration());
  }

  /**
   * Gets the effective duration accounting for time-stretching at current playback rate.
   * At rates < 1.0, stretched buffers are longer than original; at rates > 1.0, shorter.
   * @returns {number} Effective duration in seconds
   */
  function getEffectiveDuration() {
    if (tracks.size === 0) return 0;
    const originalDuration = Math.max(...Array.from(tracks.values()).map(t => t.duration));
    if (playbackRate === 1.0 || playbackRate === 0) return originalDuration;
    // WSOLA output length: outLen = Math.round(inputLen / playbackRate)
    // So at 0.9x: 100s becomes ~111s; at 0.8x: 100s becomes ~125s
    return originalDuration / playbackRate;
  }

  /**
   * Gets the total duration of the mix.
   * @returns {number} Duration in seconds
   */
  function getTotalDuration() {
    return getEffectiveDuration();
  }

  /**
   * Handles playback reaching the end.
   */
  function handlePlaybackEnd() {
    stop();
    if (onPlaybackEnd) {
      onPlaybackEnd();
    }
  }

  /**
   * Starts the time update animation loop.
   */
  function startTimeUpdateLoop() {
    const METER_INTERVAL_MS = 100; // 10 fps
    let lastMeterTime = 0;

    const update = (timestamp) => {
      if (!isPlaying) return;

      const currentTime = getCurrentTime();
      const totalDuration = getTotalDuration();

      if (onTimeUpdate) {
        onTimeUpdate(currentTime, totalDuration);
      }

      if (timestamp - lastMeterTime >= METER_INTERVAL_MS) {
        updateLevelMeters();
        lastMeterTime = timestamp;
      }

      if (currentTime >= totalDuration) {
        handlePlaybackEnd();
        return;
      }

      animationFrameId = requestAnimationFrame(update);
    };

    animationFrameId = requestAnimationFrame(update);
  }

  /**
   * Updates the level meters from analyser nodes.
   */
  // Map RMS to meter level using dBFS scale: -50 dBFS → 0%, 0 dBFS → 100%
  function rmsToLevel(rms) {
    if (rms < 0.00316) return 0; // below -50 dBFS floor
    const db = 20 * Math.log10(rms);
    return Math.max(0, Math.min(1, (db + 50) / 50));
  }

  function calcRms(analyser) {
    let buf = _rmsBuffers.get(analyser);
    if (!buf) {
      buf = new Float32Array(analyser.fftSize);
      _rmsBuffers.set(analyser, buf);
    }
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    return Math.sqrt(sum / buf.length);
  }

  function smoothMeterValue(prev, next) {
    const ATTACK = 0.45;
    const RELEASE = 0.14;
    const coeff = next > prev ? ATTACK : RELEASE;
    return prev + (next - prev) * coeff;
  }

  function buildTrackOverview(track, points, totalSamples) {
    const leftData = track.buffer.getChannelData(0);
    const rightData = track.buffer.getChannelData(1);
    const samples = new Array(points);
    const bucketSize = Math.max(1, Math.ceil(totalSamples / points));

    for (let pointIndex = 0; pointIndex < points; pointIndex++) {
      const start = pointIndex * bucketSize;
      const end = Math.min(totalSamples, start + bucketSize);
      const step = Math.max(1, Math.floor((end - start) / 128));
      let peak = 0;

      for (let sampleIndex = start; sampleIndex < end; sampleIndex += step) {
        const mixedLeft = leftData[sampleIndex];
        const mixedRight = rightData[sampleIndex];
        const monoLevel = Math.abs((mixedLeft + mixedRight) * 0.5);
        if (monoLevel > peak) {
          peak = monoLevel;
        }
      }

      samples[pointIndex] = Math.min(1, peak);
    }

    return samples;
  }

  function buildMixOverview(points = 256, trackOrder = null) {
    if (tracks.size === 0) return { master: [], tracks: [] };

    normalizeTrackLengths();

    const totalSamples = Math.max(...Array.from(tracks.values()).map(track => track.buffer.length));
    if (totalSamples <= 0) return { master: [], tracks: [] };

    const orderedTracks = Array.isArray(trackOrder) && trackOrder.length
      ? trackOrder.map(trackId => tracks.get(trackId)).filter(Boolean)
      : Array.from(tracks.values());

    const overviewTracks = orderedTracks.map(track => ({
        id: track.id,
        buffer: track.buffer,
        left: track.buffer.getChannelData(0),
        right: track.buffer.getChannelData(1),
      }));

    if (!overviewTracks.length) {
      return {
        master: new Array(points).fill(0),
        tracks: []
      };
    }

    const trackOverviews = overviewTracks.map(track => ({
      trackId: track.id,
      samples: buildTrackOverview(track, points, totalSamples)
    }));

    const samples = new Array(points).fill(0);
    for (let pointIndex = 0; pointIndex < points; pointIndex++) {
      let combinedLevel = 0;
      for (let trackIndex = 0; trackIndex < trackOverviews.length; trackIndex++) {
        combinedLevel += trackOverviews[trackIndex].samples[pointIndex] || 0;
      }
      samples[pointIndex] = Math.min(1, combinedLevel);
    }

    return {
      master: samples,
      tracks: trackOverviews
    };
  }

  function getWaveformOverview(points = 256, trackOrder = null) {
    const orderKey = Array.isArray(trackOrder) ? trackOrder.join('|') : '';
    if (mixOverviewCache && mixOverviewCache.points === points && mixOverviewCache.orderKey === orderKey) {
      return mixOverviewCache.samples;
    }

    const samples = buildMixOverview(points, trackOrder);
    mixOverviewCache = { points, orderKey, samples };
    return samples;
  }

  function updateLevelMeters() {
    if (!analyserLeft || !analyserRight || !onLevelUpdate) return;

    const leftRms  = calcRms(analyserLeft);
    const rightRms = calcRms(analyserRight);
    const leftPeak  = leftRms * Math.SQRT2;  // approximate peak from RMS
    const rightPeak = rightRms * Math.SQRT2;

    const trackLevels = [];

    tracks.forEach(track => {
      const { left, right } = getTrackMeterLevel(track);
      trackLevels.push({ trackId: track.id, left, right });
    });

    const nextMasterLeft = rmsToLevel(leftRms);
    const nextMasterRight = rmsToLevel(rightRms);
    _masterMeterSmooth.left = smoothMeterValue(_masterMeterSmooth.left, nextMasterLeft);
    _masterMeterSmooth.right = smoothMeterValue(_masterMeterSmooth.right, nextMasterRight);

    onLevelUpdate({
      leftLevel: _masterMeterSmooth.left,
      rightLevel: _masterMeterSmooth.right,
      leftPeak,
      rightPeak,
      clipping: leftPeak > 0.99 || rightPeak > 0.99,
      trackLevels
    });
  }

  function getTrackMeterLevel(track) {
    if (!track.meterAnalyserLeft || !track.meterAnalyserRight) return { left: 0, right: 0 };
    const leftRms = calcRms(track.meterAnalyserLeft);
    const rightRms = calcRms(track.meterAnalyserRight);
    const monoRms = Math.sqrt((leftRms * leftRms + rightRms * rightRms) * 0.5);
    const monoLevel = rmsToLevel(monoRms);

    // Per-track meter uses a mono level and applies L/C/R assignment from pan.
    let targetLeft = monoLevel;
    let targetRight = monoLevel;
    if (track.pan <= -0.5) {
      targetRight = 0;
    } else if (track.pan >= 0.5) {
      targetLeft = 0;
    }

    const prev = _trackMeterSmooth.get(track.id) || { left: 0, right: 0 };
    const next = {
      left: smoothMeterValue(prev.left, targetLeft),
      right: smoothMeterValue(prev.right, targetRight),
    };
    _trackMeterSmooth.set(track.id, next);
    return next;
  }

  /**
   * Stops the time update animation loop.
   */
  function stopTimeUpdateLoop() {
    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
    }
  }

  // =========================================
  // Offline Rendering
  // =========================================

  /**
   * Renders the current mix offline.
   * @param {Function} onProgress - Progress callback (0-100)
   * @returns {Promise<AudioBuffer>} Rendered audio buffer
   */
  async function renderOffline(onProgress = null) {
    if (tracks.size === 0) {
      throw new Error('No tracks loaded');
    }
    
    // Normalize track lengths
    normalizeTrackLengths();
    
    const trackArray = Array.from(tracks.values());
    const sampleRate = trackArray[0].buffer.sampleRate;
    const maxLength = Math.max(...trackArray.map(t => t.buffer.length));
    
    console.log(`Starting offline render: ${maxLength} samples at ${sampleRate}Hz`);
    
    if (onProgress) onProgress(10);
    
    // Create offline context
    offlineContext = new OfflineAudioContext(2, maxLength, sampleRate);
    
    // Create offline mixer chain
    const offlineMerger = offlineContext.createChannelMerger(2);
    const offlineLeftBus = offlineContext.createGain();
    const offlineRightBus = offlineContext.createGain();
    const offlineLeftPan = offlineContext.createGain();
    const offlineRightPan = offlineContext.createGain();
    const offlineMaster = offlineContext.createGain();
    
    // Get current master volume and pan
    offlineMaster.gain.value = masterGain ? masterGain.gain.value : 1.0;
    
    // Set pan values
    const leftPanValue = 1 - Math.max(0, masterPan);
    const rightPanValue = 1 + Math.min(0, masterPan);
    offlineLeftPan.gain.value = leftPanValue;
    offlineRightPan.gain.value = rightPanValue;
    
    // Connect offline chain
    offlineLeftBus.connect(offlineLeftPan);
    offlineRightBus.connect(offlineRightPan);
    offlineLeftPan.connect(offlineMerger, 0, 0);
    offlineRightPan.connect(offlineMerger, 0, 1);
    offlineMerger.connect(offlineMaster);
    offlineMaster.connect(offlineContext.destination);
    
    if (onProgress) onProgress(20);
    
    // Create sources for each track
    trackArray.forEach(track => {
      const source = offlineContext.createBufferSource();
      source.buffer = track.buffer;
      
      const splitter = offlineContext.createChannelSplitter(2);
      const leftGain = offlineContext.createGain();
      const rightGain = offlineContext.createGain();
      
      // Apply gain values (respecting mute/solo and pan/level)
      const anySolo = trackArray.some(t => t.solo);
      const shouldPlay = !track.muted && (!anySolo || track.solo);
      
      if (shouldPlay) {
        // Calculate left/right gains from pan and level
        const leftPanGain = 1 - Math.max(0, track.pan);
        const rightPanGain = 1 + Math.min(0, track.pan);
        
        leftGain.gain.value = leftPanGain * track.level;
        rightGain.gain.value = rightPanGain * track.level;
      } else {
        leftGain.gain.value = 0;
        rightGain.gain.value = 0;
      }
      
      // Connect chain
      source.connect(splitter);
      splitter.connect(leftGain, 0);
      splitter.connect(rightGain, 1);
      leftGain.connect(offlineLeftBus);
      rightGain.connect(offlineRightBus);
      
      // Start source
      source.start(0);
    });
    
    if (onProgress) onProgress(30);
    
    // Render
    const renderedBuffer = await offlineContext.startRendering();
    
    if (onProgress) onProgress(80);
    
    // Check for clipping and normalize if needed
    const normalizedBuffer = normalizeIfClipping(renderedBuffer);
    
    if (onProgress) onProgress(100);
    
    console.log('Offline render complete');
    return normalizedBuffer;
  }

  /**
   * Checks for clipping and normalizes if necessary.
   * @param {AudioBuffer} buffer - Audio buffer to check
   * @returns {AudioBuffer} Normalized buffer
   */
  function normalizeIfClipping(buffer) {
    let peakValue = 0;
    
    // Find peak value across all channels
    for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < data.length; i++) {
        const absValue = Math.abs(data[i]);
        if (absValue > peakValue) {
          peakValue = absValue;
        }
      }
    }
    
    console.log('Peak value:', peakValue.toFixed(4));
    
    // If not clipping, return as-is
    if (peakValue <= 1.0) {
      return buffer;
    }
    
    // Normalize to 0.95 peak
    const targetPeak = 0.95;
    const normalizationFactor = targetPeak / peakValue;
    
    console.log(`Normalizing by factor ${normalizationFactor.toFixed(4)} to prevent clipping`);
    
    for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < data.length; i++) {
        data[i] *= normalizationFactor;
      }
    }
    
    return buffer;
  }

  // =========================================
  // Export
  // =========================================

  /**
   * Exports the mix as a WAV file.
   * @param {string} filename - Output filename (without extension)
   * @param {Function} onProgress - Progress callback
   * @returns {Promise<void>}
   */
  async function exportWav(filename, onProgress = null) {
    // Render offline
    const buffer = await renderOffline(onProgress);
    
    // Encode to WAV
    const wavBlob = WavEncoder.audioBufferToWav(buffer);
    
    // Trigger download
    downloadBlob(wavBlob, `${filename}.wav`);
  }

  /**
   * Downloads a blob as a file.
   * @param {Blob} blob - The blob to download
   * @param {string} filename - The filename
   */
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // =========================================
  // Utilities
  // =========================================

  /**
   * Formats time in seconds to mm:ss.
   * @param {number} seconds - Time in seconds
   * @returns {string} Formatted time
   */
  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }


  function setOnLevelUpdate(callback) {
    onLevelUpdate = callback;
  }

  /**
   * Gets all current mix settings for saving.
   * @returns {Object} Mix settings
   */
  function getMixSettings() {
    const settings = {
      masterVolume: masterGain ? masterGain.gain.value : 1.0,
      masterPan: masterPan,
      tracks: {}
    };
    
    tracks.forEach((track, id) => {
      settings.tracks[track.name] = {
        pan: track.pan,
        level: track.level,
        muted: track.muted,
        solo: track.solo
      };
    });
    
    return settings;
  }

  /**
   * Applies saved mix settings.
   * @param {Object} settings - Mix settings to apply
   */
  function applyMixSettings(settings) {
    if (settings.masterVolume !== undefined) {
      setMasterVolume(settings.masterVolume);
    }
    if (settings.masterPan !== undefined) {
      setMasterPan(settings.masterPan);
    }
    
    if (settings.tracks) {
      _soloCount = 0;
      tracks.forEach((track, id) => {
        const trackSettings = settings.tracks[track.name];
        if (trackSettings) {
          track.pan = trackSettings.pan !== undefined ? trackSettings.pan : 0.0;
          track.level = trackSettings.level !== undefined ? trackSettings.level : 1.0;
          track.muted = trackSettings.muted || false;
          track.solo = trackSettings.solo || false;
          if (track.solo) _soloCount++;
          updateTrackGains(track);
        }
      });
    }
  }
  /**
   * Gets track info for display.
   * @returns {Array} Array of track info objects
   */
  function getTrackInfo() {
    return Array.from(tracks.values()).map(track => ({
      id: track.id,
      name: track.name,
      duration: track.duration,
      durationFormatted: formatTime(track.duration),
      leftGain: track.leftGain,
      rightGain: track.rightGain,
      muted: track.muted,
      solo: track.solo
    }));
  }

  /**
   * Gets playback state.
   * @returns {Object} Playback state
   */
  function getPlaybackState() {
    return {
      isPlaying,
      isPaused,
      currentTime: getCurrentTime(),
      totalDuration: getTotalDuration()
    };
  }

  // =========================================
  // Callbacks
  // =========================================

  function setOnTimeUpdate(callback) {
    onTimeUpdate = callback;
  }

  function setOnPlaybackEnd(callback) {
    onPlaybackEnd = callback;
  }

  function setOnTrackLoaded(callback) {
    onTrackLoaded = callback;
  }

  // =========================================
  // Public API
  // =========================================

  return {
    // Initialization
    init,
    
    // Track management
    loadTrack,
    loadTrackFromBuffer,
    removeTrack,
    clearAllTracks,
    hasTrack: (trackId) => tracks.has(trackId),
    getTrackInfo,
    
    // Gain control
    setTrackPan,
    setTrackLevel,
    setMasterVolume,
    setMasterPan,
    setTrackMuted,
    setTrackSolo,
    dbToGain,
    gainToDb,
    setPlaybackRate,

    // Playback
    play,
    pause,
    stop,
    seek,
    getCurrentTime,
    getTotalDuration,
    getPlaybackState,
    getWaveformOverview,
    
    // Export
    renderOffline,
    exportWav,
    
    // Utilities
    formatTime,
    
    // Callbacks
    setOnTimeUpdate,
    setOnPlaybackEnd,
    setOnTrackLoaded,
    setOnLevelUpdate,
    
    // Settings
    getMixSettings,
    applyMixSettings
  };

})();
</script>

/**
 * WAV Encoder - Converts AudioBuffer to WAV file
 *
 * This module handles encoding of Web Audio API AudioBuffers
 * into standard 16-bit PCM WAV format for download.
 */

const WavEncoder = (() => {
  'use strict';

  /**
   * Converts an AudioBuffer to a WAV Blob.
   * @param {AudioBuffer} audioBuffer - The audio buffer to encode
   * @param {Object} options - Encoding options
   * @param {number} options.bitDepth - Bit depth (16 or 32), default 16
   * @returns {Blob} WAV file as a Blob
   */
  function audioBufferToWav(audioBuffer, options = {}) {
    const bitDepth = options.bitDepth || 16;
    const numChannels = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
    const length = audioBuffer.length;
    
    // Interleave channels
    const interleaved = interleaveChannels(audioBuffer);
    
    // Create WAV file
    const wavBuffer = encodeWav(interleaved, {
      sampleRate: sampleRate,
      numChannels: numChannels,
      bitDepth: bitDepth
    });
    
    return new Blob([wavBuffer], { type: 'audio/wav' });
  }

  /**
   * Interleaves multi-channel audio data into a single array.
   * @param {AudioBuffer} audioBuffer - The audio buffer
   * @returns {Float32Array} Interleaved samples
   */
  function interleaveChannels(audioBuffer) {
    const numChannels = audioBuffer.numberOfChannels;
    const length = audioBuffer.length;
    const result = new Float32Array(length * numChannels);
    
    // Get all channel data
    const channels = [];
    for (let ch = 0; ch < numChannels; ch++) {
      channels.push(audioBuffer.getChannelData(ch));
    }
    
    // Interleave: L0, R0, L1, R1, L2, R2, ...
    let index = 0;
    for (let i = 0; i < length; i++) {
      for (let ch = 0; ch < numChannels; ch++) {
        result[index++] = channels[ch][i];
      }
    }
    
    return result;
  }

  /**
   * Encodes interleaved samples into WAV format.
   * @param {Float32Array} samples - Interleaved audio samples
   * @param {Object} options - Encoding options
   * @returns {ArrayBuffer} WAV file data
   */
  function encodeWav(samples, options) {
    const { sampleRate, numChannels, bitDepth } = options;
    const bytesPerSample = bitDepth / 8;
    const blockAlign = numChannels * bytesPerSample;
    const byteRate = sampleRate * blockAlign;
    const dataSize = samples.length * bytesPerSample;
    const headerSize = 44;
    const totalSize = headerSize + dataSize;
    
    const buffer = new ArrayBuffer(totalSize);
    const view = new DataView(buffer);
    
    // RIFF header
    writeString(view, 0, 'RIFF');
    view.setUint32(4, totalSize - 8, true); // File size - 8
    writeString(view, 8, 'WAVE');
    
    // fmt chunk
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);           // Chunk size (16 for PCM)
    view.setUint16(20, 1, true);            // Audio format (1 = PCM)
    view.setUint16(22, numChannels, true);  // Number of channels
    view.setUint32(24, sampleRate, true);   // Sample rate
    view.setUint32(28, byteRate, true);     // Byte rate
    view.setUint16(32, blockAlign, true);   // Block align
    view.setUint16(34, bitDepth, true);     // Bits per sample
    
    // data chunk
    writeString(view, 36, 'data');
    view.setUint32(40, dataSize, true);     // Data size
    
    // Write audio data
    if (bitDepth === 16) {
      writeSamples16(view, 44, samples);
    } else if (bitDepth === 32) {
      writeSamples32(view, 44, samples);
    }
    
    return buffer;
  }

  /**
   * Writes a string to a DataView.
   * @param {DataView} view - The DataView
   * @param {number} offset - Byte offset
   * @param {string} string - String to write
   */
  function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  /**
   * Writes 16-bit PCM samples to a DataView.
   * @param {DataView} view - The DataView
   * @param {number} offset - Starting byte offset
   * @param {Float32Array} samples - Audio samples (-1 to 1)
   */
  function writeSamples16(view, offset, samples) {
    for (let i = 0; i < samples.length; i++) {
      // Clamp to -1 to 1, then scale to 16-bit range
      const sample = Math.max(-1, Math.min(1, samples[i]));
      const value = sample < 0 
        ? sample * 0x8000  // Negative: multiply by 32768
        : sample * 0x7FFF; // Positive: multiply by 32767
      view.setInt16(offset + (i * 2), value, true);
    }
  }

  /**
   * Writes 32-bit float samples to a DataView.
   * @param {DataView} view - The DataView
   * @param {number} offset - Starting byte offset
   * @param {Float32Array} samples - Audio samples
   */
  function writeSamples32(view, offset, samples) {
    for (let i = 0; i < samples.length; i++) {
      view.setFloat32(offset + (i * 4), samples[i], true);
    }
  }

  /**
   * Calculates the expected file size for a WAV export.
   * @param {number} durationSeconds - Audio duration in seconds
   * @param {number} sampleRate - Sample rate (default 44100)
   * @param {number} numChannels - Number of channels (default 2)
   * @param {number} bitDepth - Bit depth (default 16)
   * @returns {Object} Size info { bytes, formatted }
   */
  function estimateFileSize(durationSeconds, sampleRate = 44100, numChannels = 2, bitDepth = 16) {
    const bytesPerSample = bitDepth / 8;
    const headerSize = 44;
    const dataSize = durationSeconds * sampleRate * numChannels * bytesPerSample;
    const totalBytes = headerSize + dataSize;
    
    return {
      bytes: totalBytes,
      formatted: formatBytes(totalBytes)
    };
  }

  /**
   * Formats bytes into human-readable string.
   * @param {number} bytes - Number of bytes
   * @returns {string} Formatted string
   */
  function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  // Public API
  return {
    audioBufferToWav,
    estimateFileSize,
    formatBytes
  };

})();

/**
 * FFmpeg Exporter - MP3 Export via ffmpeg.wasm
 *
 * This is an OPTIONAL module that provides MP3 export functionality
 * using ffmpeg.wasm. It requires loading the ffmpeg.wasm library.
 *
 * Usage:
 * 1. Include ffmpeg.wasm library in your HTML
 * 2. Call FFmpegExporter.init() before exporting
 * 3. Call FFmpegExporter.exportMp3(audioBuffer, filename, bitrate)
 * 
 * Note: ffmpeg.wasm is ~25MB and may take time to load.
 */

const FFmpegExporter = (() => {
  'use strict';

  let ffmpeg = null;
  let isLoaded = false;
  let isLoading = false;

  // FFmpeg.wasm CDN URL
  const FFMPEG_CDN = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js';
  const FFMPEG_CORE_CDN = 'https://unpkg.com/@ffmpeg/core@0.12.4/dist/umd/ffmpeg-core.js';

  /**
   * Loads the ffmpeg.wasm library.
   * @param {Function} onProgress - Progress callback
   * @returns {Promise<boolean>} True if successful
   */
  async function init(onProgress = null) {
    if (isLoaded) return true;
    if (isLoading) return false;
    
    isLoading = true;
    
    try {
      if (onProgress) onProgress('Loading ffmpeg.wasm library...');
      
      // Check if FFmpeg is already available
      if (typeof FFmpeg === 'undefined') {
        // Dynamically load the script
        await loadScript(FFMPEG_CDN);
      }
      
      if (typeof FFmpeg === 'undefined' || typeof FFmpeg.createFFmpeg === 'undefined') {
        throw new Error('FFmpeg library not loaded correctly');
      }
      
      ffmpeg = FFmpeg.createFFmpeg({
        log: true,
        corePath: FFMPEG_CORE_CDN
      });
      
      if (onProgress) onProgress('Initializing ffmpeg...');
      
      await ffmpeg.load();
      
      isLoaded = true;
      isLoading = false;
      
      console.log('FFmpeg.wasm loaded successfully');
      return true;
      
    } catch (error) {
      console.error('Failed to load ffmpeg.wasm:', error);
      isLoading = false;
      throw error;
    }
  }

  /**
   * Dynamically loads a script.
   * @param {string} src - Script URL
   * @returns {Promise<void>}
   */
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  /**
   * Exports an AudioBuffer as MP3.
   * @param {AudioBuffer} audioBuffer - The audio buffer to export
   * @param {string} filename - Output filename (without extension)
   * @param {Object} options - Export options
   * @param {number} options.bitrate - Bitrate in kbps (default 192)
   * @param {Function} options.onProgress - Progress callback
   * @returns {Promise<Blob>} MP3 blob
   */
  async function exportMp3(audioBuffer, filename, options = {}) {
    const bitrate = options.bitrate || 192;
    const onProgress = options.onProgress || null;
    
    if (!isLoaded) {
      await init(onProgress);
    }
    
    if (onProgress) onProgress('Converting to WAV...');
    
    // First convert to WAV
    const wavBlob = WavEncoder.audioBufferToWav(audioBuffer);
    const wavData = new Uint8Array(await wavBlob.arrayBuffer());
    
    if (onProgress) onProgress('Encoding MP3...');
    
    // Write WAV to ffmpeg virtual filesystem
    ffmpeg.FS('writeFile', 'input.wav', wavData);
    
    // Convert to MP3
    await ffmpeg.run(
      '-i', 'input.wav',
      '-b:a', `${bitrate}k`,
      '-y',
      'output.mp3'
    );
    
    // Read the output
    const mp3Data = ffmpeg.FS('readFile', 'output.mp3');
    
    // Clean up
    ffmpeg.FS('unlink', 'input.wav');
    ffmpeg.FS('unlink', 'output.mp3');
    
    if (onProgress) onProgress('Done!');
    
    // Create blob and trigger download
    const mp3Blob = new Blob([mp3Data.buffer], { type: 'audio/mp3' });
    downloadBlob(mp3Blob, `${filename}.mp3`);
    
    return mp3Blob;
  }

  /**
   * Downloads a blob as a file.
   * @param {Blob} blob - The blob to download
   * @param {string} filename - The filename
   */
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /**
   * Checks if ffmpeg.wasm is loaded.
   * @returns {boolean}
   */
  function isReady() {
    return isLoaded;
  }

  /**
   * Gets available bitrate options.
   * @returns {Array<Object>}
   */
  function getBitrateOptions() {
    return [
      { value: 128, label: '128 kbps (Small file)' },
      { value: 192, label: '192 kbps (Recommended)' },
      { value: 256, label: '256 kbps (High quality)' },
      { value: 320, label: '320 kbps (Best quality)' }
    ];
  }

  // Public API
  return {
    init,
    exportMp3,
    isReady,
    getBitrateOptions
  };

})();

<script>
/**
 * Track label parsing — extracts short voice-type labels and song title from MP3 filenames.
 *
 * Strategy (applied in order):
 * 1. Strip noise phrases ("Choral Track") and .mp3 extension
 * 2. If any file contains '_': use underscore-prefix convention
 *    - Label = part before first '_' (abbreviations expanded: Sop1→Soprano 1, etc.)
 *    - If all labels are identical: treat prefix as song title, use after-_ parts as labels
 *    - Song title = common prefix of after-'_' content (punctuation-normalized comparison)
 * 3. Otherwise: find longest common prefix; if meaningful, use as title and unique endings as labels
 *    Fallback: common suffix; if still not meaningful, use full names
 */

const NOISE_PATTERNS = [
  /\s+choral\s+track\b/gi,
];

const LABEL_EXPANSIONS = {
  sop1: 'Soprano 1',
  sop2: 'Soprano 2',
  s1: 'Soprano 1',
  s2: 'Soprano 2',
};

// Voice-type suffix pattern: " - Soprano 1", " – Alto", " Tenor", etc.
const VOICE_SUFFIX_RE = /[\s\-–—]+(?:soprano\s*[12]?|bass\s*[12]?|alto|tenor)\s*$/gi;

function stripNoise(name) {
  let s = name;
  for (const re of NOISE_PATTERNS) {
    s = s.replace(re, '');
  }
  // Trim trailing separators and whitespace
  return s.replace(/[\s\-–—_]+$/, '').trim();
}

function normalizeLabel(raw) {
  const trimmed = raw.trim();
  return LABEL_EXPANSIONS[trimmed.toLowerCase()] || trimmed;
}

function normalizeForComparison(s) {
  return s
    .toLowerCase()
    .replace(/[,;:–—\-\.]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function extractWords(s) {
  return s.match(/\b\w+\b/g) || [];
}

function stripTrailingVoice(s) {
  return s.replace(VOICE_SUFFIX_RE, '').replace(/[\s\-–—]+$/, '').trim();
}

/**
 * Given an array of title-pool strings, find the longest common word-prefix
 * (using punctuation-normalized comparison) and extract it from the original
 * first string, preserving its original punctuation and casing.
 */
function extractCommonTitle(pools) {
  if (pools.length === 0) return '';
  const clean = pools.map(stripTrailingVoice);
  if (pools.length === 1) return clean[0];

  const normalized = clean.map(normalizeForComparison);
  const wordSets = normalized.map(extractWords);
  const minWords = Math.min(...wordSets.map(w => w.length));

  let commonWordCount = 0;
  for (let i = 0; i < minWords; i++) {
    const word = wordSets[0][i];
    if (wordSets.every(ws => ws[i] === word)) {
      commonWordCount = i + 1;
    } else {
      break;
    }
  }

  if (commonWordCount === 0) return clean[0];

  // Walk the original first-file string, matching commonWordCount words
  const original = clean[0];
  const targetWords = wordSets[0].slice(0, commonWordCount);
  let pos = 0;
  let wordIdx = 0;
  while (wordIdx < targetWords.length && pos < original.length) {
    while (pos < original.length && !/\w/.test(original[pos])) pos++;
    if (pos >= original.length) break;
    const word = targetWords[wordIdx];
    if (original.slice(pos, pos + word.length).toLowerCase() === word.toLowerCase()) {
      pos += word.length;
      wordIdx++;
    } else {
      pos++;
    }
  }

  return original.slice(0, pos).trim();
}

function parseTrackLabels(files) {
  if (files.length === 0) return { songTitle: '', labels: new Map() };

  const baseNames = files.map(f => f.name.replace(/\.mp3$/i, ''));
  const cleanNames = baseNames.map(stripNoise);

  if (cleanNames.length === 1) {
    return { songTitle: cleanNames[0], labels: new Map([[files[0].id, cleanNames[0]]]) };
  }

  const hasUnderscore = cleanNames.some(n => n.includes('_'));

  if (hasUnderscore) {
    const parts = cleanNames.map(n => {
      const idx = n.indexOf('_');
      if (idx === -1) return { before: null, after: n };
      return { before: n.slice(0, idx).trim(), after: n.slice(idx + 1).trim() };
    });

    const rawLabels = parts.map(p =>
      p.before !== null ? normalizeLabel(p.before) : p.after
    );

    const titlePool = parts.filter(p => p.before !== null).map(p => p.after);

    // When all labels are identical the naming is Title_Track — swap
    const uniqueLabels = new Set(rawLabels);
    if (uniqueLabels.size === 1) {
      const songTitle = [...uniqueLabels][0];
      const swappedLabels = parts.map((p, i) =>
        p.before !== null
          ? p.after.replace(/^[\s\-–—_]+/, '').replace(/[\s\-–—_]+$/, '') || cleanNames[i]
          : cleanNames[i]
      );
      return {
        songTitle,
        labels: new Map(files.map((f, i) => [f.id, swappedLabels[i]])),
      };
    }

    const songTitle = extractCommonTitle(titlePool);
    return {
      songTitle: songTitle || 'Mix',
      labels: new Map(files.map((f, i) => [f.id, rawLabels[i] || cleanNames[i]])),
    };
  }

  // No underscore — try common prefix first, then common suffix
  const minLen = Math.min(...cleanNames.map(n => n.length));

  let prefixLen = 0;
  for (let i = 0; i < minLen; i++) {
    const chars = cleanNames.map(n => n[i].toLowerCase());
    if (chars.every(c => c === chars[0])) prefixLen = i + 1;
    else break;
  }

  const rawPrefix = cleanNames[0].slice(0, prefixLen);
  const songTitleFromPrefix = rawPrefix.replace(/[\s_\-\.]+$/, '');

  if (songTitleFromPrefix.length >= 2) {
    const uniqueEndings = cleanNames.map(n =>
      n.slice(prefixLen).replace(/^[\s_\-\.]+/, '')
    );
    return {
      songTitle: songTitleFromPrefix,
      labels: new Map(files.map((f, i) => [f.id, uniqueEndings[i] || cleanNames[i]])),
    };
  }

  let suffixLen = 0;
  for (let i = 1; i <= minLen; i++) {
    const chars = cleanNames.map(n => n[n.length - i].toLowerCase());
    if (chars.every(c => c === chars[0])) suffixLen = i;
    else break;
  }

  const rawSuffix = suffixLen > 0 ? cleanNames[0].slice(cleanNames[0].length - suffixLen) : '';
  const songTitleFromSuffix = rawSuffix.replace(/^[\s_\-\.]+/, '');

  if (songTitleFromSuffix.length >= 2) {
    const uniqueBeginnings = cleanNames.map(n =>
      n.slice(0, n.length - suffixLen).replace(/[\s_\-\.]+$/, '')
    );
    return {
      songTitle: songTitleFromSuffix,
      labels: new Map(files.map((f, i) => [f.id, uniqueBeginnings[i] || cleanNames[i]])),
    };
  }

  return {
    songTitle: 'Mix',
    labels: new Map(files.map((f, i) => [f.id, cleanNames[i]])),
  };
}

// Node.js compatibility — not executed in GAS (no `module` global there)
if (typeof module !== 'undefined') {
  module.exports = { parseTrackLabels };
}

/**
 * UI Logic - v2.0 Navigation-First Redesign
 * Selection page → Playback page with responsive layout
