<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDocs</title>
<link rel="stylesheet" href="app/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main id="main">
  <section class="hero-card">
    <div class="hero-main">
      <div>
        <div class="eyebrow">Northlake document library</div>
        <h1>NDocs</h1>
        <p>Find current practices, guides, policies, and team-owned resources without hunting through Drive.</p>
      </div>
      <div class="hero-actions"><a class="button button--primary" href="catalog.html">Open Catalog</a></div>
    </div>
  </section>

  <section id="ndocs-identity-card" class="surface" aria-label="Your account"></section>

  <div class="page-header" style="margin-top:1.2rem;margin-bottom:.6rem">
    <div>
      <h2 class="section-title" style="font-size:1.3rem">Your teams</h2>
      <p>Open a team workspace to review inventory and outstanding work.</p>
    </div>
  </div>
  <section id="ndocs-team-tiles" class="team-grid" aria-label="Your teams" aria-busy="true"></section>
</main>

<script>
// Build-time stamps — replaced by tools/static-pages.js (gas-static) immediately before
// publish. Left null in the unbuilt source: a raw static-src/index.html opened directly has
// no backend to call and no identity provider to call either.
var STATIC_BUILD_VERSION_ = "0.0.0.52";
var STATIC_WEBAPP_URL_ = "https://script.google.com/macros/s/AKfycbz8_za32WV8jhkzhlDc8-FkwBFxAj1RNP1PWQV1RIz91qJwYV1foynm5dahABsaTY7L/exec";
var STATIC_ENV_LABEL_ = "SIT";
var STATIC_BUILD_ENV_ = "test";
var STATIC_DISPATCH_URL_ = "https://script.google.com/macros/s/AKfycbwmoOPRDThQWDzMPU5H-6aVzvnprYbIL8yjbhLX3wBbi89ZY7cRLc2_yoYUK1H8LcX3/exec";
var STATIC_GIS_CLIENT_ID_ = "657771271619-8ebgf03k3rp872vlib3ibsktl9sk4ig1.apps.googleusercontent.com";
</script>
<!-- The shared front-end modules — this project's CLAUDE.md "reuse, do not re-derive". No
     page-local <style> or scaffolding: app/shell.js owns the skip link, header, footer, and
     the sign-in/launch/error/app-view progression (ADR-0012, NDocs-3il). -->
<script src="app/config.js"></script>
<script src="app/ui.js"></script>
<script src="app/session.js"></script>
<script src="app/transport.js"></script>
<script src="app/shell.js"></script>
<script src="app/page-identity.js"></script>
<script>
(function () {
  'use strict';
  NDocsShell.mount({
    activePage: 'index',
    pageContent: document.getElementById('main'),
    onEnter: NDocsPageIdentity.start
  });
})();
</script>
</body>
</html>
