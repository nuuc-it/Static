 */

const UI = (() => {
  // ================================================================
  // STATE
  // ================================================================

  const state = {
    // Folder/folder context
    folderId: null,
    folderName: null,
    currentPath: [],
    folderFiles: [],
    folderSubFolders: [],

    // Track selection & loading
    selectedFileIds: new Set(),
    trackLoadStatus: new Map(),
    songTitle: '',
    loadedTracks: new Map(),
    trackMixSettings: new Map(),

    // In-memory folder cache: Map<folderId, { folderId, folderName, audio, folders }>
    // Populated from the depth-2 children scan on initial load; checked before any RPC.
    folderCache: new Map(),

    // Playback state
    isPlaying: false,
    repeatEnabled: false,
    playbackSpeed: 1.0,

    // View state
    currentPage: 'selection',

    // Navigation stack for subfolder back-navigation
    navStack: [],

    // Incremented on every folder change; captured by loadTrackFile to detect navigation during load
    folderToken: 0,

    // Playback meter elements keyed by trackId
    trackMeterElements: new Map(),
    masterWaveformVisible: false,
    isSeeking: false,
  };

  let masterWaveformContext = null;

  // ================================================================
  // SESSION STORAGE — folder listing cache (atc-79j)
  // ================================================================

  // sessionStorage has no TTL and survives reloads for the life of the tab, so
  // an unscoped key serves a pre-deploy listing indefinitely to anyone who
  // keeps the app open. Scoping by build stamp orphans those entries on deploy,
  // mirroring what the build stamp does for the server cache (src/Admin.js).
  function folderCacheKeyPrefix() {
    const stamp = (typeof BUILD_INFO !== 'undefined' && BUILD_INFO.buildDate)
      ? BUILD_INFO.buildDate
      : 'nostamp';
    return 'atc_folder_' + stamp + '_';
  }

  function getFolderSessionCache(key) {
    try {
      const raw = sessionStorage.getItem(folderCacheKeyPrefix() + key);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  function setFolderSessionCache(key, data) {
    try {
      sessionStorage.setItem(folderCacheKeyPrefix() + key, JSON.stringify(data));
    } catch (_) { /* quota exceeded — skip silently */ }
  }

  // Drop listings written by an earlier build so orphaned entries cannot
  // accumulate against the sessionStorage quota.
  function pruneStaleFolderSessionCache() {
    try {
      const keep = folderCacheKeyPrefix();
      const stale = [];
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        if (k && k.indexOf('atc_folder_') === 0 && k.indexOf(keep) !== 0) stale.push(k);
      }
      stale.forEach(k => sessionStorage.removeItem(k));
    } catch (_) { /* storage unavailable — nothing to prune */ }
  }

  // getDriveToken() was removed by PMIX-PLAN.md stage P1R (bd atc-b0o): it
  // fetched the OWNER's full-Drive OAuth token so the browser could fetch bytes
  // directly, which cannot survive stage P2's flip to ANYONE_ANONYMOUS. Track
  // loading now always goes through loadTrackFileViaBase64(), which was already
  // this path's fallback. Slower, hands out nothing. See src/Code.js's removal
  // note and PMIX-PLAN.md D3.

  // ================================================================
  // DOM ELEMENTS (cached)
  // ================================================================

  const el = {};

  function cacheElements() {
    // Pages
    el.selectionPage = document.getElementById('selection-page');
    el.playbackPage = document.getElementById('playback-page');

    // Selection page
    el.folderName = document.getElementById('folder-name');
    el.songTitle = document.getElementById('song-title');
    el.trackCountInfo = document.getElementById('track-count-info');
    el.trackButtons = document.getElementById('track-buttons');
    el.subfoldersContainer = document.getElementById('subfolders-container');
    el.subfoldersList = document.getElementById('subfolders-list');
    el.playSelectedBtn = document.getElementById('play-selected-btn');
    el.openNewBtn = document.getElementById('open-new-btn');
    el.selectionBackBtn = document.getElementById('selection-back-btn');
    el.folderPicker = document.getElementById('folder-picker');
    el.pickerOverlay = document.getElementById('picker-overlay');
    el.closePickerBtn = document.getElementById('close-picker-btn');
    el.folderIdInput = document.getElementById('folder-id-input');
    el.folderGoBtn = document.getElementById('folder-go-btn');
    el.folderStatus = document.getElementById('folder-status');
    el.selectionStatus = document.getElementById('selection-status');

    // Playback page
    el.backBtn = document.getElementById('back-btn');
    el.playbackTitle = document.getElementById('playback-title');

    // Transport
    el.rewindBtn = document.getElementById('rewind-btn');
    el.skipBackBtn = document.getElementById('skip-back-btn');
    el.playBtn = document.getElementById('play-btn');
    el.stopBtn = document.getElementById('stop-btn');
    el.skipFwdBtn = document.getElementById('skip-fwd-btn');
    el.currentTime = document.getElementById('current-time');
    el.seekBar = document.getElementById('seek-bar');
    el.totalTime = document.getElementById('total-time');
    el.repeatCheckbox = document.getElementById('repeat-checkbox');

    // Master
    el.masterVolume = document.getElementById('master-volume');
    el.masterVolumeValue = document.getElementById('master-volume-value');
    el.masterPan = document.getElementById('master-pan');
    el.masterPanValue = document.getElementById('master-pan-value');
    el.masterWaveformToggle = document.getElementById('master-waveform-toggle');
    el.masterWaveformGraph = document.getElementById('master-waveform-graph');
    el.masterWaveformCanvas = document.getElementById('master-waveform-canvas');
    el.meterLeft = document.getElementById('meter-left');
    el.meterRight = document.getElementById('meter-right');

    // Tracks
    el.tracksContainer = document.getElementById('tracks-container');

    // Speed controls
    el.speedDisplay = document.getElementById('speed-display');
    el.speedSlowBtn = document.getElementById('speed-slow-btn');
    el.speedFastBtn = document.getElementById('speed-fast-btn');

    // Export
    el.exportFilename = document.getElementById('export-filename');
    el.exportWavBtn = document.getElementById('export-wav-btn');
    el.exportMp3Btn = document.getElementById('export-mp3-btn');
    el.exportStatus = document.getElementById('export-status');

    // Version footer
    el.versionFooter = document.getElementById('version-footer');
  }

  // ================================================================
  // BACKEND LOGGING (for Playwright test validation)
  // ================================================================

  // Collapses rapid slider input events to one call per animation frame.
  function rafThrottle(fn) {
    let queued = false;
    let lastValue;
    return function(value) {
      lastValue = value;
      if (!queued) {
        queued = true;
        requestAnimationFrame(() => {
          fn(lastValue);
          queued = false;
        });
      }
    };
  }

  function logBackend(functionName, result) {
    const log = {
      function: functionName,
      success: result && !result.error,
      error: result?.error || null,
      duration: result?.logs?.duration || 0,
      ...result?.logs,
    };
    console.log('[BACKEND]', JSON.stringify(log));
  }

  // ================================================================
  // FILENAME PARSING
  // ================================================================

  // parseTrackLabels is defined in trackLabels.js.html (included before this file)

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ================================================================
  // FOLDER SELECTION
  // ================================================================

  function handleOpenNewClick() {
    el.folderIdInput.value = '';
    showFolderStatus('', '');
    showFolderPicker(true);
  }

  function extractFolderId(input) {
    const s = input.trim();
    const m = s.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9_-]+$/.test(s)) return s;
    return null;
  }

  function clearSelectedTracks() {
    state.selectedFileIds.forEach(id => AudioEngine.removeTrack(id));
    state.selectedFileIds.clear();
    state.trackLoadStatus.clear();
    state.loadedTracks.clear();
    state.trackMixSettings.clear();
  }

  async function handleFolderGoClick() {
    const folderId = extractFolderId(el.folderIdInput.value);
    if (!folderId) {
      showFolderStatus('Enter a valid folder ID or Drive URL', 'error');
      return;
    }

    // Immediately flip to content area with loading state so the user sees
    // feedback before the RPC resolves (can take several seconds first time).
    showFolderPicker(false);
    showFolderLoadingState();

    // Invalidate any in-flight track loads before awaiting the RPC.
    state.folderToken++;

    try {
      let result = getFolderSessionCache(folderId);
      if (!result || result.error) {
        result = await callApi('listFilesAndFolders', { folderId: folderId, folderPath: [] });
        if (!result.error) setFolderSessionCache(folderId, result);
      }

      if (result.error) {
        showFolderPicker(true);
        showFolderStatus(result.error, 'error');
        return;
      }

      logBackend('listFilesAndFolders', result);
      state.folderId = result.folderId;
      state.folderName = result.folderName;
      state.currentPath = result.currentPath || [];
      state.folderFiles = result.audio || [];
      state.folderSubFolders = result.folders || [];
      state.navStack = [];

      clearSelectedTracks();

      el.folderName.textContent = state.folderName;
      el.selectionBackBtn.style.display = 'none';
      renderTrackButtons();
      renderSubFolders();
    } catch (error) {
      showFolderPicker(true);
      showFolderStatus('Failed to load folder: ' + error, 'error');
    }
  }

  function showFolderPicker(show) {
    if (show) {
      el.folderPicker.classList.remove('hidden');
    } else {
      el.folderPicker.classList.add('hidden');
    }
  }

  function showFolderStatus(message, type) {
    el.folderStatus.textContent = message;
    el.folderStatus.className = 'status-message ' + type;
  }

  function showFolderLoadingState() {
    el.folderName.textContent = 'Loading…';
    el.trackButtons.innerHTML = '';
    el.subfoldersContainer.style.display = 'none';
    el.songTitle.textContent = '';
    el.trackCountInfo.textContent = '';
  }

  /**
   * Three capabilities the HtmlService sandbox never allowed, claimed now that the page owns its
   * own document: a real title, a real favicon, and real address-bar state. This stage proves
   * only that they work — the full URL-state contract belongs to atc-es8/atc-z49/atc-7k0/atc-ex0,
   * which were blocked on this migration rather than on themselves.
   */
  function setFavicon() {
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<text y="80" font-size="80">🎵</text></svg>';
    const link = document.querySelector('link[rel="icon"]') || document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/svg+xml';
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
    if (!link.parentNode) document.head.appendChild(link);
  }

  function setDocumentTitle(folderOrSong) {
    document.title = folderOrSong ? folderOrSong + ' — Practice Mix' : 'Practice Mix';
  }

  /**
   * Puts the current folder in the address bar without a reload, so the page is linkable and the
   * back button is not a dead end. `?webapp=` is dropped on the way through: it is a local-dev
   * bootstrap parameter, already remembered in sessionStorage, and has no business in a link
   * anyone shares.
   */
  function syncAddressBar() {
    if (!state.folderId) return;
    try {
      const url = new URL(window.location.href);
      url.searchParams.delete('webapp');
      url.searchParams.set('folder', state.folderId);
      window.history.replaceState({ folderId: state.folderId }, '', url.toString());
    } catch (e) {
      console.warn('[url] could not update the address bar', e);
    }
  }

  function showSelectionStatus(message, type) {
    el.selectionStatus.textContent = message;
    el.selectionStatus.className = 'status-message ' + type;
    el.selectionStatus.style.display = message ? '' : 'none';
  }

  // ================================================================
  // TRACK BUTTONS (Selection Page)
  // ================================================================

  function getVoiceColor(label) {
    const l = (label || '').toLowerCase();
    if (l.includes('soprano')) return '#e8b4d4';
    if (l.includes('alto'))    return '#a3d4a8';
    if (l.includes('tenor'))   return '#9bb8e6';
    if (l.includes('bass'))    return '#c8a585';
    if (l.includes('piano'))   return '#bda3e6';
    if (l.includes('solo'))    return '#e6c79b';
    if (l.includes('mix'))     return '#d4d4d4';
    return '#8a93a1';
  }

  function renderTrackButtons() {
    const { songTitle, labels } = parseTrackLabels(state.folderFiles);
    state.songTitle = songTitle;

    el.songTitle.textContent = songTitle;
    el.trackCountInfo.textContent = `${state.folderFiles.length} track${state.folderFiles.length !== 1 ? 's' : ''}`;

    el.trackButtons.innerHTML = '';

    state.folderFiles.forEach(file => {
      const label = labels.get(file.id);
      const color = getVoiceColor(label);
      const status = state.trackLoadStatus.get(file.id) === 'loaded' ? 'loaded' : 'available';
      const isSelected = state.selectedFileIds.has(file.id);

      const btn = document.createElement('button');
      btn.className = 'track-btn';
      btn.setAttribute('data-testid', 'track-button');
      btn.dataset.fileId = file.id;
      btn.dataset.status = status;
      btn.dataset.selected = isSelected ? 'true' : 'false';

      btn.innerHTML = `
        <span class="track-btn-check">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="#0b0d10" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12.5 9.5 18 20 7"/>
          </svg>
        </span>
        <span class="track-btn-stripe" style="background:${color}"></span>
        <span class="track-btn-name">${escapeHtml(label)}</span>
        <span class="track-btn-state"></span>
      `;

      updateTrackBtnState(btn, status);
      btn.addEventListener('click', () => handleTrackButtonClick(file.id));
      el.trackButtons.appendChild(btn);
    });

    updatePlaySelectedButton();
    updateSelectionCountLabel();
  }

  function updateTrackBtnState(btn, status) {
    btn.dataset.status = status;
    const stateEl = btn.querySelector('.track-btn-state');
    if (!stateEl) return;
    if (status === 'loaded')   { stateEl.textContent = '✓ Loaded'; }
    else if (status === 'loading') { stateEl.textContent = '⏳ Loading'; }
    else                       { stateEl.textContent = '○ Available'; }
  }

  function updateSelectionCountLabel() {
    const countEl = document.getElementById('selection-count-label');
    if (!countEl) return;
    const n = state.selectedFileIds.size;
    countEl.innerHTML = n > 0
      ? `<span class="mono">${n}</span> selected`
      : '';
  }

  function renderSubFolders() {
    setDocumentTitle(state.folderName);
    syncAddressBar();

    if (!state.folderSubFolders || state.folderSubFolders.length === 0) {
      el.subfoldersContainer.style.display = 'none';
      return;
    }

    el.subfoldersContainer.style.display = 'block';

    // Collapse when tracks are also present so tracks remain the primary focus
    if (state.folderFiles.length > 0) {
      el.subfoldersContainer.classList.add('collapsed');
    } else {
      el.subfoldersContainer.classList.remove('collapsed');
    }

    el.subfoldersList.innerHTML = '';

    state.folderSubFolders.forEach(folder => {
      const btn = document.createElement('button');
      btn.className = 'btn subfolder-btn';
      // Shortcuts are marked as links by the icon alone: they open the target
      // folder, but Back returns here, to the folder that holds the shortcut.
      btn.textContent = (folder.isShortcut ? '🔗 ' : '📁 ') + folder.name;
      if (folder.isShortcut) {
        btn.title = 'Shortcut to another folder';
        btn.dataset.shortcut = 'true';
      }
      btn.addEventListener('click', () => handleSubFolderClick(folder.id));
      el.subfoldersList.appendChild(btn);
    });
  }

  function prefetchSubfolders(subfolders) {
    subfolders.slice(0, 10).forEach(subfolder => {
      if (state.folderCache.has(subfolder.id)) return;
      callApi('listFilesAndFolders', { folderId: subfolder.id, folderPath: [] }).then(result => {
        if (!result.error) {
          state.folderCache.set(subfolder.id, result);
        }
      }).catch(() => { /* prefetch is best-effort */ });
    });
  }

  function pushNav() {
    state.navStack.push({
      folderId: state.folderId,
      folderName: state.folderName,
      folderFiles: [...state.folderFiles],
      folderSubFolders: [...state.folderSubFolders],
    });
    el.selectionBackBtn.style.display = '';
  }

  function handleSelectionBack() {
    if (!state.navStack.length) return;
    state.folderToken++;
    const prev = state.navStack.pop();
    state.folderId = prev.folderId;
    state.folderName = prev.folderName;
    state.folderFiles = prev.folderFiles;
    state.folderSubFolders = prev.folderSubFolders;
    el.folderName.textContent = state.folderName;
    clearSelectedTracks();
    renderTrackButtons();
    renderSubFolders();
    if (!state.navStack.length) {
      el.selectionBackBtn.style.display = 'none';
    }
  }

  async function handleSubFolderClick(folderId) {
    pushNav();

    // Invalidate any in-flight track loads immediately, before any await.
    state.folderToken++;

    // Check in-memory cache first, then sessionStorage, then RPC.
    const cached = state.folderCache.get(folderId) || getFolderSessionCache(folderId);
    if (!cached) showFolderLoadingState();

    if (cached) {
      state.folderCache.set(folderId, cached);
      state.folderId = cached.folderId;
      state.folderName = cached.folderName;
      state.currentPath = [{ id: cached.folderId, name: cached.folderName }];
      state.folderFiles = cached.audio || [];
      state.folderSubFolders = cached.folders || [];
      el.folderName.textContent = state.folderName;
      clearSelectedTracks();
      renderTrackButtons();
      renderSubFolders();
      return;
    }

    // Fallback RPC for folders not in any cache.
    try {
      const result = await callApi('listFilesAndFolders', { folderId: folderId, folderPath: state.currentPath });

      if (result.error) {
        handleSelectionBack();
        showSelectionStatus('Failed to open folder: ' + result.error, 'error');
        return;
      }

      logBackend('listFilesAndFolders', result);

      state.folderId = result.folderId;
      state.folderName = result.folderName;
      state.currentPath = result.currentPath || [];
      state.folderFiles = result.audio || [];
      state.folderSubFolders = result.folders || [];

      state.folderCache.set(folderId, result);
      setFolderSessionCache(folderId, result);

      el.folderName.textContent = state.folderName;
      showSelectionStatus('', '');
      clearSelectedTracks();
      renderTrackButtons();
      renderSubFolders();
    } catch (error) {
      handleSelectionBack();
      showSelectionStatus('Failed to open folder: ' + error, 'error');
    }
  }

  async function handleTrackButtonClick(fileId) {
    const btn = document.querySelector(`[data-file-id="${fileId}"]`);

    // Toggle selection
    const isSelected = state.selectedFileIds.has(fileId);
    if (isSelected) {
      state.selectedFileIds.delete(fileId);
      state.trackLoadStatus.delete(fileId);
      if (btn) { btn.dataset.selected = 'false'; updateTrackBtnState(btn, 'available'); }
      // Keep track cached in AudioEngine memory for reuse, but mute it so it
      // does not contribute audio if play() is called while still loaded.
      if (AudioEngine.hasTrack(fileId)) {
        AudioEngine.setTrackMuted(fileId, true);
      }
    } else {
      state.selectedFileIds.add(fileId);
      if (btn) btn.dataset.selected = 'true';
      const status = state.trackLoadStatus.get(fileId);
      if (status === 'loaded' || AudioEngine.hasTrack(fileId)) {
        // Already in AudioEngine memory — no re-fetch needed
        if (btn) updateTrackBtnState(btn, 'loaded');
        state.trackLoadStatus.set(fileId, 'loaded');
      } else if (!status || status === 'available') {
        if (btn) updateTrackBtnState(btn, 'loading');
        state.trackLoadStatus.set(fileId, 'loading');
        const tokenBeforeLoad = state.folderToken;
        await loadTrackFile(fileId);

        // Skip UI update if the user deselected or navigated away during the load
        if (state.folderToken !== tokenBeforeLoad || !state.selectedFileIds.has(fileId)) {
          if (AudioEngine.hasTrack(fileId)) AudioEngine.setTrackMuted(fileId, true);
          return;
        }

        // Only mark as loaded if AudioEngine confirms the track is resident
        const currentBtn = document.querySelector(`[data-file-id="${fileId}"]`);
        if (AudioEngine.hasTrack(fileId)) {
          if (currentBtn) updateTrackBtnState(currentBtn, 'loaded');
          state.trackLoadStatus.set(fileId, 'loaded');
        } else {
          // Load failed — deselect so a single click re-selects and retries
          state.selectedFileIds.delete(fileId);
          state.trackLoadStatus.delete(fileId);
          if (currentBtn) { currentBtn.dataset.selected = 'false'; updateTrackBtnState(currentBtn, 'available'); }
        }
      }
    }

    updatePlaySelectedButton();
    updateSelectionCountLabel();
  }

  async function loadTrackFile(fileId) {
    const file = state.folderFiles.find(f => f.id === fileId);
    if (!file) return;
    await loadTrackFileViaBase64(fileId, file, state.folderToken);
  }

  /**
   * The one track-loading path since P1R (bd atc-b0o) removed the direct-fetch
   * route it used to back up. `token` is the folder generation guard, not an
   * auth token — see state.folderToken.
   */
  async function loadTrackFileViaBase64(fileId, file, token) {
    try {
      const t0 = performance.now();
      const result = await Promise.race([
        callApi('getFileAsBase64', { fileId: fileId }),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('getFileAsBase64 timeout')), 18000)
        )
      ]);

      if (state.folderToken !== token) {
        console.log(`[load] stale load ignored after base64 fetch: ${fileId}`);
        return;
      }

      if (result.error) {
        console.error('[base64] Failed to load track:', result.error);
        state.trackLoadStatus.set(fileId, 'available');
        return;
      }

      const t1 = performance.now();
      console.log(`[base64] getFileAsBase64: ${(t1 - t0).toFixed(0)}ms  size: ${result.sizeMB}MB`);

      const trackInfo = await AudioEngine.loadTrack(fileId, result.dataUri, file.name);
      if (state.folderToken !== token) {
        console.log(`[load] stale load ignored after base64 decode: ${fileId}`);
        AudioEngine.removeTrack(fileId);
        return;
      }
      const t2 = performance.now();
      console.log(`[base64] loadTrack (fetch+decode): ${(t2 - t1).toFixed(0)}ms`);
      console.log(`[base64] TOTAL: ${(t2 - t0).toFixed(0)}ms  (${result.sizeMB}MB)`);

      state.loadedTracks.set(fileId, trackInfo);
    } catch (error) {
      console.error('[base64] Error loading track:', error);
      state.trackLoadStatus.set(fileId, 'available');
    }
  }

  function updatePlaySelectedButton() {
    const allLoaded = [...state.selectedFileIds].every(id =>
      state.trackLoadStatus.get(id) === 'loaded'
    );
    el.playSelectedBtn.disabled = state.selectedFileIds.size === 0 || !allLoaded;
  }

  function navigateToPlayback() {
    state.currentPage = 'playback';
    el.selectionPage.classList.remove('active');
    el.selectionPage.classList.add('hidden');
    el.playbackPage.classList.remove('hidden');
    el.playbackPage.classList.add('active');

    el.playbackTitle.textContent = state.songTitle || state.folderName;
    renderPlaybackTracks();
    updatePlaybackUI();
  }

  function navigateToSelection() {
    state.currentPage = 'selection';
    AudioEngine.stop();
    setPlayingState(false);

    el.playbackPage.classList.remove('active');
    el.playbackPage.classList.add('hidden');
    el.selectionPage.classList.remove('hidden');
    el.selectionPage.classList.add('active');
  }

  // ================================================================
  // PLAYBACK PAGE
  // ================================================================

  function renderPlaybackTracks() {
    el.tracksContainer.innerHTML = '';
    state.trackMeterElements.clear();

    const { labels } = parseTrackLabels(state.folderFiles);
    const selectedIds = [...state.selectedFileIds];
    const selectedIdSet = new Set(selectedIds);
    // Preset slider positions (0..100) for track level buttons.
    const trackLevelValues = {
      mute: 0,
      low: 20,
      medium: 50,
      normal: 100,
    };
    const trackPanValues = {
      left: -1.0,
      center: 0.0,
      right: 1.0,
    };

    for (const fileId of Array.from(state.trackMixSettings.keys())) {
      if (!selectedIdSet.has(fileId)) {
        state.trackMixSettings.delete(fileId);
      }
    }

    selectedIds.forEach((fileId, index) => {
      const label = labels.get(fileId);
      const mixSettings = state.trackMixSettings.get(fileId) || {
        levelKey: index === 0 ? 'normal' : 'low',
        panKey: 'center',
        solo: false,
        mute: false,
      };
      state.trackMixSettings.set(fileId, mixSettings);

      AudioEngine.setTrackMuted(fileId, mixSettings.mute);
      // Use same gamma mapping as master so presets match perceived volume.
      const gammaForTracks = VolumeMapping.computeGammaForTargetDb(-10);
      const gain = VolumeMapping.sliderValueToGainGamma(trackLevelValues[mixSettings.levelKey], gammaForTracks);
      AudioEngine.setTrackLevel(fileId, gain);
      AudioEngine.setTrackPan(fileId, trackPanValues[mixSettings.panKey]);
      AudioEngine.setTrackSolo(fileId, mixSettings.solo);

      const color = getVoiceColor(label);
      const isMuted = !!mixSettings.mute;

      const row = document.createElement('div');
      row.className = 'track-row' + (mixSettings.solo ? ' row-soloed' : '') + (isMuted ? ' row-muted' : '');
      row.dataset.testid = 'track-row';
      row.dataset.trackId = fileId;

      row.innerHTML = `
        <div class="track-voice-stripe" style="background:${color}"></div>
        <span class="track-name" data-testid="track-name">${escapeHtml(label)}</span>
        <div class="track-activity-bar" data-testid="track-activity-bar"></div>

        <div class="track-spacer"></div>

        <div class="track-mix-line2" data-testid="track-mix-line2">
          <div class="track-controls-group track-level-group" data-testid="track-level-group">
            <div class="segmented-control btn-group" data-testid="track-level-buttons">
              <button class="btn-level${mixSettings.levelKey === 'mute' ? ' active-mute' : ''}" data-testid="track-level-mute" data-level-key="mute" aria-label="Mute track">0</button>
              <button class="btn-level${mixSettings.levelKey === 'low' ? ' active-low' : ''}" data-testid="track-level-low" data-level-key="low" aria-label="Set level low">1</button>
              <button class="btn-level${mixSettings.levelKey === 'medium' ? ' active-medium' : ''}" data-testid="track-level-medium" data-level-key="medium" aria-label="Set level medium">2</button>
              <button class="btn-level${mixSettings.levelKey === 'normal' ? ' active-normal' : ''}" data-testid="track-level-normal" data-level-key="normal" aria-label="Set level high">3</button>
            </div>
          </div>

          <div class="track-controls-group track-pan-group" data-testid="track-pan-group">
            <div class="segmented-control btn-group" data-testid="track-pan-buttons">
              <button class="btn-pan${mixSettings.panKey === 'left'   ? ' active' : ''}" data-testid="track-pan-left"   data-pan-key="left"   aria-label="Pan left">L</button>
              <button class="btn-pan${mixSettings.panKey === 'center' ? ' active' : ''}" data-testid="track-pan-center" data-pan-key="center" aria-label="Pan center">·</button>
              <button class="btn-pan${mixSettings.panKey === 'right'  ? ' active' : ''}" data-testid="track-pan-right"  data-pan-key="right"  aria-label="Pan right">R</button>
            </div>
          </div>
        </div>

        <button class="track-sm-btn track-solo" data-testid="track-solo"
                aria-label="Solo track" aria-pressed="${mixSettings.solo ? 'true' : 'false'}">S</button>
        <button class="track-sm-btn track-mute-btn${isMuted ? ' mute-active' : ''}" data-testid="track-mute"
                aria-label="Mute track" aria-pressed="${isMuted ? 'true' : 'false'}">M</button>

        <div class="track-actions">
          <div class="track-meter" data-testid="track-meter">
            <div class="meter-track track-meter-l"><div class="meter-bar track-meter-bar-l"></div></div>
            <div class="meter-track track-meter-r"><div class="meter-bar track-meter-bar-r"></div></div>
          </div>
        </div>

        <!-- Second spacer: one spacer can only push the controls right, never centre them. Both
             are display:none in the wrapped (compact/mobile) layouts. -->
        <div class="track-spacer"></div>
      `;

      // Event listeners
      const soloBtn = row.querySelector('.track-solo');
      const muteBtn = row.querySelector('.track-mute-btn');
      const levelButtons = row.querySelectorAll('.btn-level');
      const panButtons = row.querySelectorAll('.btn-pan');
      state.trackMeterElements.set(fileId, {
        left:  row.querySelector('.track-meter-bar-l'),
        right: row.querySelector('.track-meter-bar-r'),
      });

      const gammaForTracksClick = VolumeMapping.computeGammaForTargetDb(-10);
      levelButtons.forEach(button => {
        button.addEventListener('click', () => {
          const levelKey = button.dataset.levelKey;
          mixSettings.levelKey = levelKey;
          levelButtons.forEach(c => { c.className = 'btn-level'; });
          button.classList.add(`active-${levelKey}`);
          const gain = VolumeMapping.sliderValueToGainGamma(trackLevelValues[levelKey], gammaForTracksClick);
          AudioEngine.setTrackLevel(fileId, gain);
        });
      });

      panButtons.forEach(button => {
        button.addEventListener('click', () => {
          const panKey = button.dataset.panKey;
          mixSettings.panKey = panKey;
          panButtons.forEach(c => c.classList.remove('active'));
          button.classList.add('active');
          AudioEngine.setTrackPan(fileId, trackPanValues[panKey]);
        });
      });

      soloBtn.addEventListener('click', () => {
        const pressed = soloBtn.getAttribute('aria-pressed') === 'true';
        const nowSolo = !pressed;
        soloBtn.setAttribute('aria-pressed', String(nowSolo));
        mixSettings.solo = nowSolo;
        AudioEngine.setTrackSolo(fileId, nowSolo);
        row.classList.toggle('row-soloed', nowSolo);
      });

      if (muteBtn) {
        muteBtn.addEventListener('click', () => {
          const pressed = muteBtn.getAttribute('aria-pressed') === 'true';
          const nowMute = !pressed;
          muteBtn.setAttribute('aria-pressed', String(nowMute));
          muteBtn.classList.toggle('mute-active', nowMute);
          mixSettings.mute = nowMute;
          AudioEngine.setTrackMuted(fileId, nowMute);
          row.classList.toggle('row-muted', nowMute);
        });
      }

      el.tracksContainer.appendChild(row);
    });
  }

  // Use IntersectionObserver + ResizeObserver for accurate and efficient overflow detection.
  // IntersectionObserver detects when key control groups are not fully inside the row.
  // ResizeObserver keeps results up to date when sizes change.
  function updateTrackRowLayout() {
    const rows = el.tracksContainer.querySelectorAll('.track-row');
    rows.forEach(row => {
      // Skip if observers already attached
      if (row.dataset.overflowAttached) return;

      const panGroup = row.querySelector('.track-pan-group');
      const actions = row.querySelector('.track-actions');
      const levelGroup = row.querySelector('.track-level-group');
      if (!panGroup || !actions || !levelGroup) return;

      const applyCompactClasses = () => {
        // First stage: wrap controls to second line when single-line layout is too tight.
        const gap = 8;
        const requiredSingle = (levelGroup.getBoundingClientRect().width || 0)
                             + (panGroup.getBoundingClientRect().width || 0)
                             + (actions.getBoundingClientRect().width || 0)
                             + gap * 2;
        const available = row.getBoundingClientRect().width;
        const shouldCompact = requiredSingle > available;
        row.classList.toggle('compact', shouldCompact);

        // Second stage: only allow aggressive name compaction if wrapped layout
        // still overflows horizontally.
        if (!shouldCompact) {
          row.classList.remove('compact-tight');
          return;
        }

        const stillOverflowing = row.scrollWidth > row.clientWidth + 1;
        row.classList.toggle('compact-tight', stillOverflowing);
      };

      // IntersectionObserver to detect if panGroup or actions are fully inside the row
      const io = new IntersectionObserver((entries) => {
        let needsCompact = false;
        entries.forEach(e => {
          // intersectionRatio === 1 means fully inside root
          if (e.intersectionRatio < 1) needsCompact = true;
        });
        if (needsCompact) {
          row.classList.add('compact');
        }
        applyCompactClasses();
      }, { root: row, threshold: [1] });

      io.observe(panGroup);
      io.observe(actions);

      // ResizeObserver as a reliable fallback / trigger to validate using bounding rects
      const ro = new ResizeObserver(() => {
        applyCompactClasses();
      });
      ro.observe(row);

      // Run once immediately after attaching observers.
      applyCompactClasses();

      // Mark attached so we don't reattach observers on re-render
      row.dataset.overflowAttached = '1';
      // Store refs so we can disconnect later if needed
      row.__overflowIo = io;
      row.__overflowRo = ro;
    });

    // Clean up observers on rows that no longer exist (defensive)
    // Iterate all rows that previously had observers and remove those not present anymore.
    document.querySelectorAll('[data-overflow-attached]').forEach(elm => {
      // noop: kept for compatibility; actual rows tag observers on the element itself
    });
  }

  function updatePlaybackUI() {
    const state_ = AudioEngine.getPlaybackState();
    el.currentTime.textContent = formatTime(state_.currentTime);
    el.totalTime.textContent = formatTime(state_.totalDuration);
    el.seekBar.max = Math.max(1, state_.totalDuration);
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  // ================================================================
  // TRANSPORT CONTROLS
  // ================================================================

  function setPlayingState(playing) {
    state.isPlaying = playing;
    el.playBtn.setAttribute('data-playing', playing ? 'true' : 'false');
    el.playBtn.textContent = playing ? '⏸' : '▶';
    el.playBtn.title = playing ? 'Pause' : 'Play';
  }

  function setupTransportControls() {
    el.playBtn.addEventListener('click', async () => {
      if (state.isPlaying) {
        AudioEngine.pause();
        setPlayingState(false);
      } else {
        await AudioEngine.play();
        setPlayingState(true);
      }
    });

    el.stopBtn.addEventListener('click', () => {
      AudioEngine.stop();
      setPlayingState(false);
    });

    el.rewindBtn.addEventListener('click', () => {
      AudioEngine.seek(0);
    });

    el.skipBackBtn.addEventListener('click', () => {
      const pos = AudioEngine.getCurrentTime();
      AudioEngine.seek(Math.max(0, pos - 5));
    });

    el.skipFwdBtn.addEventListener('click', () => {
      const pos = AudioEngine.getCurrentTime();
      const total = AudioEngine.getTotalDuration();
      AudioEngine.seek(Math.min(total, pos + 5));
    });

    // During drag: update time display only (no audio restart).
    // On release: seek to the chosen position.
    const beginSeekInteraction = () => {
      state.isSeeking = true;
    };

    const endSeekInteraction = () => {
      state.isSeeking = false;
    };

    el.seekBar.addEventListener('pointerdown', beginSeekInteraction);
    el.seekBar.addEventListener('pointerup', endSeekInteraction);
    el.seekBar.addEventListener('touchstart', beginSeekInteraction, { passive: true });
    el.seekBar.addEventListener('touchend', endSeekInteraction, { passive: true });
    el.seekBar.addEventListener('blur', endSeekInteraction);

    el.seekBar.addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      el.currentTime.textContent = formatTime(t);
    });
    el.seekBar.addEventListener('change', (e) => {
      endSeekInteraction();
      AudioEngine.seek(parseFloat(e.target.value));
    });

    el.repeatCheckbox.addEventListener('change', (e) => {
      state.repeatEnabled = e.target.checked;
    });
  }

  // ================================================================
  // SPEED CONTROLS
  // ================================================================

  function updateSpeedDisplay() {
    const s = state.playbackSpeed;
    el.speedDisplay.textContent = s.toFixed(1) + '×';
    el.speedDisplay.className = 'speed-display ' +
      (s > 1.05 ? 'speed-fast' : s < 0.95 ? 'speed-slow' : 'speed-normal');
  }

  function setSpeedProcessing(processing) {
    el.speedSlowBtn.disabled = processing;
    el.speedFastBtn.disabled = processing;
    el.playBtn.disabled = processing;
    if (processing) {
      el.speedDisplay.textContent = '⏳';
      el.speedDisplay.className = 'speed-display speed-normal';
    }
  }

  async function handleSpeedChange(delta) {
    const newSpeed = Math.max(0.7, Math.min(1.3,
      Math.round((state.playbackSpeed + delta) * 10) / 10
    ));

    // Already at this rate (boundary clamp) — nothing to process
    if (newSpeed === state.playbackSpeed) return;

    // Stop playback immediately so there is no conflict with WSOLA
    if (state.isPlaying) {
      AudioEngine.stop();
      setPlayingState(false);
    }

    state.playbackSpeed = newSpeed;

    // Show ⏳ synchronously so the browser paints it before WSOLA runs
    setSpeedProcessing(true);

    // Yield so the browser paints ⏳ before WSOLA blocks the thread
    await new Promise(resolve => setTimeout(resolve, 0));
    AudioEngine.setPlaybackRate(newSpeed);

    setSpeedProcessing(false);
    updateSpeedDisplay();
    updatePlaybackUI();
  }

  function setupSpeedControls() {
    el.speedSlowBtn.addEventListener('click', () => handleSpeedChange(-0.1));
    el.speedFastBtn.addEventListener('click', () => handleSpeedChange(+0.1));
  }

  // ================================================================
  // MASTER CONTROLS
  // ================================================================

  function setupMasterControls() {
    const updateMasterWaveformGraphMeta = () => {
      el.masterWaveformGraph.setAttribute('data-waveform-row-count', String(state.selectedFileIds.size + 1));
      el.masterWaveformGraph.setAttribute('data-waveform-master-row', '0');
    };

    const refreshMasterWaveformGraph = () => {
      if (!state.masterWaveformVisible) return;
      drawMasterWaveformGraph(AudioEngine.getWaveformOverview(256, [...state.selectedFileIds]));
    };

    const syncMasterWaveformCanvasSize = () => {
      updateMasterWaveformGraphMeta();

      const rowCount = Number(el.masterWaveformGraph.getAttribute('data-waveform-row-count') || '1');
      const rowHeight = 12;
      const rowGap = 4;
      const paddingY = 4;
      const width = Math.max(1, Math.floor(el.seekBar.clientWidth || el.masterWaveformGraph.clientWidth || 1));
      const height = Math.max(1, paddingY * 2 + rowCount * rowHeight + Math.max(0, rowCount - 1) * rowGap);

      el.masterWaveformGraph.style.width = `${width}px`;

      if (el.masterWaveformCanvas.width !== width) {
        el.masterWaveformCanvas.width = width;
      }
      if (el.masterWaveformCanvas.height !== height) {
        el.masterWaveformCanvas.height = height;
      }

      if (!masterWaveformContext) {
        masterWaveformContext = el.masterWaveformCanvas.getContext('2d');
      }
    };

    const drawMasterWaveformGraph = (waveformRows) => {
      if (!state.masterWaveformVisible || !waveformRows) return;

      syncMasterWaveformCanvasSize();
      const ctx = masterWaveformContext;
      if (!ctx) return;

      const rowHeight = 12;
      const rowGap = 4;
      const paddingY = 4;
      const maxDb = 0;
      const minDb = -40;
      const floorGain = Math.pow(10, minDb / 20);
      const rows = [waveformRows.master, ...waveformRows.tracks.map(track => track.samples)];

      ctx.clearRect(0, 0, el.masterWaveformCanvas.width, el.masterWaveformCanvas.height);

      rows.forEach((samples, index) => {
        if (!samples || !samples.length) return;

        const top = paddingY + index * (rowHeight + rowGap);
        const bottomY = top + rowHeight - 1;

        ctx.fillStyle = index === 0 ? 'rgba(98, 163, 255, 0.28)' : 'rgba(180, 190, 210, 0.18)';
        ctx.strokeStyle = index === 0 ? 'rgba(98, 163, 255, 0.95)' : 'rgba(180, 190, 210, 0.85)';
        ctx.lineWidth = 1.25;
        ctx.beginPath();

        samples.forEach((sample, sampleIndex) => {
          const x = samples.length === 1
            ? 0
            : (sampleIndex / (samples.length - 1)) * el.masterWaveformCanvas.width;
          const db = 20 * Math.log10(Math.max(sample, floorGain));
          const normalized = Math.max(0, Math.min(1, (db - minDb) / (maxDb - minDb)));
          const y = top + (1 - normalized) * (rowHeight - 1);
          if (sampleIndex === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });

        ctx.stroke();

        ctx.lineTo(el.masterWaveformCanvas.width, bottomY);
        ctx.lineTo(0, bottomY);
        ctx.closePath();
        ctx.fill();
      });
    };

    const setMasterWaveformVisible = (visible) => {
      state.masterWaveformVisible = !!visible;
      el.masterWaveformGraph.hidden = !visible;
      el.masterWaveformToggle.setAttribute('aria-expanded', String(visible));
      updateMasterWaveformGraphMeta();

      if (visible) {
        refreshMasterWaveformGraph();
      }
    };

    // Use gamma mapping so center can map to a chosen dB (e.g. -10 dB).
    const targetCenterDb = -10; // user-requested target at slider=0.5
    const gamma = VolumeMapping.computeGammaForTargetDb(targetCenterDb);
    const onMasterVolume = rafThrottle(v => {
      const gain = VolumeMapping.sliderValueToGainGamma(v, gamma);
      AudioEngine.setMasterVolume(gain);
      const perceived = VolumeMapping.sliderValueToPerceivedLinear(v);
      el.masterVolumeValue.textContent = perceived.toFixed(2);
      el.masterVolume.title = perceived.toFixed(2) + ' — ' + VolumeMapping.gainToDb(gain).toFixed(1) + ' dB';
      refreshMasterWaveformGraph();
    });
    el.masterVolume.addEventListener('input', (e) => onMasterVolume(parseInt(e.target.value)));
    el.masterVolume.title = VolumeMapping.sliderValueToDb(parseInt(el.masterVolume.value)).toFixed(1) + ' dB';
    // Initialize displayed perceived value for current slider position
    onMasterVolume(parseInt(el.masterVolume.value));

    const onMasterPan = rafThrottle(v => {
      const pan = v / 100;
      AudioEngine.setMasterPan(pan);
      el.masterPanValue.textContent = pan < -0.1 ? 'L' : pan > 0.1 ? 'R' : 'C';
      refreshMasterWaveformGraph();
    });
    el.masterPan.addEventListener('input', (e) => onMasterPan(parseInt(e.target.value)));

    el.masterWaveformToggle.addEventListener('click', () => {
      setMasterWaveformVisible(el.masterWaveformGraph.hidden);
    });

    window.addEventListener('resize', () => {
      if (state.masterWaveformVisible) {
        refreshMasterWaveformGraph();
      }
    });

    setMasterWaveformVisible(false);
  }

  // ================================================================
  // EXPORT
  // ================================================================

  function setupExportControls() {
    el.exportWavBtn.addEventListener('click', async () => {
      const filename = el.exportFilename.value || 'mix';
      try {
        el.exportStatus.textContent = 'Exporting…';
        el.exportStatus.className = 'status-message info';
        await AudioEngine.exportWav(filename + '.wav');
        el.exportStatus.textContent = 'Export complete!';
        el.exportStatus.className = 'status-message success';
      } catch (error) {
        el.exportStatus.textContent = 'Export failed: ' + error;
        el.exportStatus.className = 'status-message error';
      }
    });

    el.exportMp3Btn.addEventListener('click', () => {
      el.exportStatus.textContent = 'MP3 export not yet available';
      el.exportStatus.className = 'status-message warning';
    });
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================

  function setupEventListeners() {
    el.openNewBtn.addEventListener('click', handleOpenNewClick);
    el.selectionBackBtn.addEventListener('click', handleSelectionBack);
    el.playSelectedBtn.addEventListener('click', navigateToPlayback);
    el.backBtn.addEventListener('click', navigateToSelection);
    el.pickerOverlay.addEventListener('click', () => showFolderPicker(false));
    el.closePickerBtn.addEventListener('click', () => showFolderPicker(false));
    el.folderGoBtn.addEventListener('click', handleFolderGoClick);
    el.folderIdInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleFolderGoClick();
    });
    el.subfoldersContainer.querySelector('h3').addEventListener('click', () => {
      el.subfoldersContainer.classList.toggle('collapsed');
    });

    setupTransportControls();
    setupSpeedControls();
    setupMasterControls();
    setupExportControls();
  }

  // ================================================================
  // INITIALIZATION
  // ================================================================

  async function init() {
    cacheElements();

    // Initialize AudioEngine
    await AudioEngine.init();

    // Set up listeners
    AudioEngine.setOnPlaybackEnd(() => {
      if (state.repeatEnabled) {
        // Loop: restart from beginning
        AudioEngine.seek(0);
        AudioEngine.play();
      } else {
        // Stop: set UI to stopped state
        setPlayingState(false);
      }
    });

    AudioEngine.setOnTimeUpdate((currentTime, totalDuration) => {
      el.currentTime.textContent = formatTime(currentTime);
      el.totalTime.textContent = formatTime(totalDuration);
      el.seekBar.max = Math.max(1, totalDuration);
      if (!state.isSeeking) {
        el.seekBar.value = currentTime;
      }
    });

    AudioEngine.setOnLevelUpdate(({ leftLevel, rightLevel, leftPeak, rightPeak, clipping, trackLevels = [] }) => {
      function levelToPercent(level) {
        return Math.max(0, Math.min(100, level * 100));
      }

      el.meterLeft.style.height = levelToPercent(leftLevel) + '%';
      el.meterRight.style.height = levelToPercent(rightLevel) + '%';
      if (clipping) {
        el.meterLeft.classList.add('clipping');
        el.meterRight.classList.add('clipping');
      } else {
        el.meterLeft.classList.remove('clipping');
        el.meterRight.classList.remove('clipping');
      }

      trackLevels.forEach(({ trackId, left, right }) => {
        const meters = state.trackMeterElements.get(trackId);
        if (meters) {
          meters.left.style.height  = levelToPercent(left) + '%';
          meters.right.style.height = levelToPercent(right) + '%';
        }
      });

    });

    setFavicon();

    if (el.versionFooter && typeof BUILD_INFO !== 'undefined') {
      el.versionFooter.textContent = BUILD_INFO.version;
    }

    setupEventListeners();
    // Initialize master slider from saved mix settings so UI and engine agree.
    try {
      const settings = AudioEngine.getMixSettings();
      if (settings && settings.masterVolume !== undefined) {
        const gammaInit = VolumeMapping.computeGammaForTargetDb(-10);
        const sliderVal = VolumeMapping.gainToSliderValueGamma(settings.masterVolume, gammaInit);
        el.masterVolume.value = sliderVal;
        el.masterVolume.dispatchEvent(new Event('input'));
      }
    } catch (e) {
      // If engine isn't ready or settings unavailable, skip silently.
      console.warn('[init] failed to apply saved master volume to UI', e);
    }

    pruneStaleFolderSessionCache();

    // Load default folder — check sessionStorage first, then RPC.
    // RPC retries once on transient Drive service errors (rate limiting under load).
    try {
      let folderResult = getFolderSessionCache('__initial__');

      if (!folderResult || folderResult.error) {
        folderResult = await callApi('listFilesAndFolders', { folderId: null, folderPath: [] });

        if (folderResult.error) {
          console.warn('[init] listFilesAndFolders error, retrying in 3s:', folderResult.error);
          await new Promise(r => setTimeout(r, 3000));
          folderResult = await callApi('listFilesAndFolders', { folderId: null, folderPath: [] });
        }

        if (!folderResult.error) {
          setFolderSessionCache('__initial__', folderResult);
          setFolderSessionCache(folderResult.folderId, folderResult);
        }
      }

      if (!folderResult.error) {
        state.folderId = folderResult.folderId;
        state.folderName = folderResult.folderName;
        state.folderFiles = folderResult.audio || [];
        state.folderSubFolders = folderResult.folders || [];
        el.folderName.textContent = state.folderName;
        renderTrackButtons();
        renderSubFolders();
      }
    } catch (error) {
      console.error('Failed to load initial folder:', error);
      // Never a blank page: the folder name is still "Loading…" at this point, and without this
      // the only evidence of failure is the console. Outside the HtmlService sandbox there is no
      // Apps Script error banner behind us to catch it.
      el.folderName.textContent = 'Not loaded';
      showSelectionStatus('Could not load your tracks: ' + (error && error.message ? error.message : error), 'error');
    }
  }

  // Run on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return { getState: () => state, getElements: () => el };
})();
</script>
</body>
</html>
