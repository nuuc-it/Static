<!doctype html>
<html lang="en">
<head>

<title>NDocs — Admin tools</title>
<link rel="stylesheet" href="app/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main id="main">
  <div class="page-header">
    <div>
      <div class="eyebrow">Administration</div>
      <h1>Admin tools</h1>
      <p>Cross-team queues and controlled values. Team-specific actions live on each team's own page.</p>
    </div>
  </div>

  <div id="ndocs-tools-summary" aria-live="polite"></div>
  <div id="ndocs-tools-sections" aria-busy="true"></div>
</main>

<script>
var STATIC_BUILD_VERSION_ = "0.0.0.48";
var STATIC_WEBAPP_URL_ = "https://script.google.com/macros/s/AKfycbz8_za32WV8jhkzhlDc8-FkwBFxAj1RNP1PWQV1RIz91qJwYV1foynm5dahABsaTY7L/exec";
var STATIC_ENV_LABEL_ = "SIT";
var STATIC_BUILD_ENV_ = "test";
var STATIC_DISPATCH_URL_ = "https://script.google.com/macros/s/AKfycbwmoOPRDThQWDzMPU5H-6aVzvnprYbIL8yjbhLX3wBbi89ZY7cRLc2_yoYUK1H8LcX3/exec";
var STATIC_GIS_CLIENT_ID_ = "657771271619-8ebgf03k3rp872vlib3ibsktl9sk4ig1.apps.googleusercontent.com";
</script>
<!-- Shared front-end modules (this project's CLAUDE.md "reuse, do not re-derive"). No
     page-local <style> or scaffolding: app/shell.js owns the shell (ADR-0012, NDocs-3il). -->
<script src="app/config.js"></script>
<script src="app/ui.js"></script>
<script src="app/session.js"></script>
<script src="app/transport.js"></script>
<script src="app/shell.js"></script>
<script src="app/records.js"></script>
<script src="app/vocab.js"></script>
<!-- page-tools.js defines window.NDocsPageTools before the mount call below runs it. -->
<script src="app/page-tools.js"></script>
<script>
(function () {
  'use strict';
  NDocsShell.mount({
    activePage: 'tools',
    pageContent: document.getElementById('main'),
    onEnter: window.NDocsPageTools.start
  });
})();
</script>
</body>
</html>
