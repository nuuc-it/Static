<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Mix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================== */
/* RESET & BASE                                                        */
/* ================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
}

.mono {
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-variant-numeric: tabular-nums;
}

/* ================================================================== */
/* DESIGN TOKENS                                                       */
/* ================================================================== */

:root {
  --bg:            #0b0d10;
  --surface-1:     #161a20;
  --surface-2:     #1d2229;
  --surface-3:     #252b33;
  --border:        #262c35;
  --border-strong: #3a4452;

  --text:   #f5f7fa;
  --text-2: #c0c8d4;
  --text-3: #8a93a1;

  --green:    oklch(0.72 0.16 155);
  --blue:     oklch(0.72 0.14 240);
  --blue-bg:  oklch(0.72 0.14 240 / 0.08);
  --amber:    oklch(0.78 0.14 70);
  --red:      oklch(0.72 0.18 25);
  --red-bg:   oklch(0.72 0.18 25 / 0.08);

  --radius: 10px;
  --spacing: 16px;
  --spacing-sm: 8px;

  /* Legacy aliases used by AudioEngine UI */
  --color-primary:       var(--blue);
  --color-success:       var(--green);
  --color-warning:       var(--amber);
  --color-danger:        var(--red);
  --text-primary:        var(--text);
  --text-secondary:      var(--text-2);
  --text-muted:          var(--text-3);
  --bg-primary:          var(--surface-1);
  --bg-secondary:        var(--bg);
  --bg-light:            var(--surface-2);
  --bg-input:            var(--surface-1);
  --border-color:        var(--border);
  --shadow:              0 2px 8px rgba(0,0,0,.5);
  --shadow-hover:        0 4px 16px rgba(0,0,0,.7);

  --play-btn-bg:          var(--green);
  --play-btn-shadow:      0 0 0 6px oklch(0.72 0.16 155 / .15), 0 8px 28px rgba(0,0,0,.4);
  --play-btn-shadow-hover:0 0 0 8px oklch(0.72 0.16 155 / .2),  0 10px 34px rgba(0,0,0,.5);
  --pause-btn-bg:         var(--amber);
  --pause-btn-shadow:     0 0 0 6px oklch(0.78 0.14 70 / .15),  0 8px 28px rgba(0,0,0,.4);
}

/* ================================================================== */
/* PAGE LAYOUT                                                         */
/* ================================================================== */

.page { display: none; min-height: 100vh; padding: var(--spacing); }
.page.active { display: block; }
.page.hidden { display: none !important; }

.container { max-width: 900px; margin: 0 auto; }

/* ================================================================== */
/* HEADER                                                             */
/* ================================================================== */

.header { text-align: center; margin-bottom: var(--spacing); }

.header h1 {
  font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--text);
}

.header-subtitle { font-size: 13px; color: var(--text-3); }

.playback-header {
  display: flex; align-items: center; gap: var(--spacing); margin-bottom: var(--spacing);
}

.playback-header h1 {
  flex: 1; font-size: 18px; text-align: center; margin: 0;
  color: var(--text); font-weight: 600; letter-spacing: -0.2px;
}

/* ================================================================== */
/* CARD                                                               */
/* ================================================================== */

.card {
  background: var(--surface-1);
  border-radius: var(--radius);
  padding: var(--spacing);
  margin-bottom: var(--spacing);
  border: 1px solid var(--border);
}

/* ================================================================== */
/* FOLDER INFO (Selection Page)                                        */
/* ================================================================== */

.folder-info {
  display: flex; align-items: center; justify-content: center;
  gap: var(--spacing-sm); font-size: 14px; color: var(--text-3);
  margin-bottom: var(--spacing-sm);
}

#selection-back-btn { font-size: 13px; }

/* ================================================================== */
/* TITLE SECTION                                                       */
/* ================================================================== */

.title-section { text-align: center; margin-bottom: var(--spacing); }

.title-section h2 { font-size: 18px; color: var(--text); margin-bottom: 4px; }

#track-count-info { font-size: 12px; color: var(--text-3); }

/* ================================================================== */
/* TRACK CARDS (Selection Page) — card list replacing chip cloud      */
/* ================================================================== */

.track-buttons-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: var(--spacing);
}

.track-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: 11px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: border-color .15s, background .15s;
  width: 100%;
}

.track-btn:hover {
  background: var(--surface-2);
  border-color: var(--blue);
}

/* Checkbox inside card */
.track-btn-check {
  width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
  background: rgba(255,255,255,.05);
  border: 2px solid var(--text-3);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s;
}

.track-btn-check svg { display: none; }

/* Selected state */
.track-btn[data-selected="true"] .track-btn-check {
  background: var(--blue);
  border-color: var(--blue);
}

.track-btn[data-selected="true"] .track-btn-check svg { display: block; }

.track-btn[data-selected="true"] {
  background: var(--surface-2);
  border-color: oklch(0.72 0.14 240 / .45);
}

/* Voice stripe */
.track-btn-stripe {
  width: 4px; height: 26px; border-radius: 2px; flex-shrink: 0;
}

/* Track name in card */
.track-btn-name {
  flex: 1; font-size: 15px; font-weight: 600; color: var(--text);
}

/* State badge */
.track-btn-state {
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px;
}

.track-btn[data-status="loaded"]   .track-btn-state { color: var(--green); }
.track-btn[data-status="loading"]  .track-btn-state { color: var(--amber); }
.track-btn[data-status="available"] .track-btn-state { color: var(--text-3); }

/* ================================================================== */
/* SUBFOLDERS                                                          */
/* ================================================================== */

.subfolders-container {
  margin-bottom: var(--spacing); padding: var(--spacing);
  background: var(--surface-1); border-radius: var(--radius);
  border-left: 3px solid var(--blue);
}

.subfolders-container h3 {
  margin-bottom: var(--spacing-sm); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text-3);
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between;
}

.subfolders-container h3::after { content: '▼'; font-size: 10px; color: var(--text-3); }
.subfolders-container.collapsed h3::after { content: '▶'; }
.subfolders-container.collapsed .subfolders-list { display: none; }
.subfolders-container.collapsed h3 { margin-bottom: 0; }

.subfolders-list { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); }

.subfolder-btn {
  min-height: 38px; padding: 6px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text-2); border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; font-family: inherit;
  transition: all .2s;
}

.subfolder-btn:hover {
  background: var(--blue); color: var(--bg); border-color: var(--blue);
}
/* ================================================================== */
/* STATUS LEGEND                                                       */
/* ================================================================== */

.status-legend {
  display: flex; gap: var(--spacing); justify-content: center; flex-wrap: wrap;
  font-size: 12px; color: var(--text-3);
  margin-top: var(--spacing); padding-top: var(--spacing);
  border-top: 1px solid var(--border);
}

.legend-item { display: flex; align-items: center; gap: 4px; }

.status-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 3px; font-size: 10px; font-weight: 700;
}

.status-icon.loaded  { background: var(--green); color: var(--bg); }
.status-icon.loading { background: var(--amber); color: var(--bg); }
.status-icon.available { background: var(--border); color: var(--text-3); }

/* ================================================================== */
/* ACTION BUTTONS                                                      */
/* ================================================================== */

.action-buttons {
  display: flex; gap: var(--spacing); justify-content: center; margin-bottom: var(--spacing);
}

@media (max-width: 479px) {
  .action-buttons { flex-direction: column; }
}

/* ================================================================== */
/* BUTTONS (General)                                                   */
/* ================================================================== */

.btn {
  padding: 10px 20px; min-height: 44px;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .2s; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}

.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-primary { background: var(--green); color: var(--bg); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

.btn-secondary {
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border-strong);
}

.btn-secondary:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }

.btn-back {
  background: var(--surface-2); color: var(--text-2);
  padding: 8px 14px; border: 1px solid var(--border-strong); font-size: 13px;
  border-radius: 9px;
}

.btn-back:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }

/* ================================================================== */
/* TRANSPORT CONTROLS                                                  */
/* ================================================================== */

.transport-section { display: flex; flex-direction: column; gap: var(--spacing-sm); }

.transport-controls {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; align-items: center;
}

.btn-transport {
  min-width: 44px; height: 44px; padding: 0 10px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border-strong);
  border-radius: 10px; font-size: 15px; font-weight: 700; font-family: inherit;
}

.btn-transport:hover:not(:disabled) {
  background: var(--surface-3); color: var(--text); border-color: var(--text-3);
  transform: translateY(-1px);
}

/* Play/Pause button */
#play-btn {
  width: 64px; height: 64px; min-width: 64px; min-height: 64px;
  border-radius: 50%; border: none; font-size: 22px;
  background: var(--play-btn-bg);
  box-shadow: var(--play-btn-shadow);
  color: var(--bg); transition: all .25s;
}

#play-btn:hover:not(:disabled) {
  transform: scale(1.07); box-shadow: var(--play-btn-shadow-hover);
}

#play-btn[data-playing="true"] {
  background: var(--pause-btn-bg);
  box-shadow: var(--pause-btn-shadow);
  animation: pulse-playing 1.8s ease-in-out infinite;
}

@keyframes pulse-playing {
  0%, 100% { box-shadow: var(--pause-btn-shadow); }
  50%       { box-shadow: 0 0 0 12px oklch(0.78 0.14 70 / .06), 0 4px 28px oklch(0.78 0.14 70 / .5); }
}

#play-btn[data-playing="true"]:hover { transform: scale(1.07); animation-play-state: paused; }

/* ================================================================== */
/* SPEED CONTROLS                                                      */
/* ================================================================== */

.speed-controls {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  background: var(--surface-1); border-radius: 10px; padding: 8px 16px;
  border: 1px solid var(--border); align-self: center;
}

.btn-speed {
  width: 36px; height: 36px; min-width: 36px; min-height: 36px; padding: 0;
  background: var(--surface-3); border: 1px solid var(--border-strong);
  color: var(--text); border-radius: 8px;
  font-size: 18px; font-weight: 700; font-family: inherit; line-height: 1;
}

.btn-speed:hover:not(:disabled) { background: var(--surface-3); color: var(--text); transform: translateY(-1px); }

.speed-display {
  min-width: 48px; text-align: center;
  font-size: 17px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: -0.5px;
  transition: color .2s;
}

.speed-display.speed-fast  { color: var(--green); }
.speed-display.speed-slow  { color: var(--red); }
.speed-display.speed-normal{ color: var(--text); }

/* ================================================================== */
/* TIME & SEEK                                                         */
/* ================================================================== */

.time-section { display: flex; align-items: flex-start; gap: var(--spacing-sm); }

.seek-stack {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.time-display {
  min-width: 38px; text-align: center; font-size: 12px;
  color: var(--text-3); font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

.seek-bar {
  flex: 1; width: 100%; min-width: 0; height: 5px; cursor: pointer;
  -webkit-appearance: none; appearance: none;
  background: var(--border); border-radius: 3px; outline: none;
}

.seek-bar::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; background: var(--blue);
  border-radius: 50%; cursor: pointer;
}

.seek-bar::-moz-range-thumb {
  width: 14px; height: 14px; background: var(--blue);
  border-radius: 50%; cursor: pointer; border: none;
}

.loop-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-3); cursor: pointer;
  padding-left: 10px; border-left: 1px solid var(--border); user-select: none;
}

.loop-toggle input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }

.loop-toggle .toggle-track {
  position: relative; display: inline-block;
  width: 34px; height: 18px;
  background: var(--border-strong); border-radius: 20px; transition: background .2s; flex-shrink: 0;
}

.loop-toggle input[type="checkbox"]:checked + .toggle-track { background: var(--green); }

.loop-toggle .toggle-track::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .2s;
}

.loop-toggle input[type="checkbox"]:checked + .toggle-track::after { transform: translateX(16px); }

/* ================================================================== */
/* MASTER CONTROLS                                                     */
/* ================================================================== */

.master-section { border: 1px solid var(--border); }

.master-section h2 {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-3); margin-bottom: var(--spacing);
}

.master-heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: var(--spacing);
}

.master-heading-row h2 {
  margin-bottom: 0;
}

.master-with-meters { display: flex; align-items: flex-end; gap: var(--spacing); }

.master-grid { display: grid; grid-template-columns: 1fr; gap: var(--spacing); flex: 1; }

@media (min-width: 600px) { .master-grid { grid-template-columns: 1fr 1fr; } }

.control-row { display: flex; flex-direction: column; gap: 6px; }

.control-row label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-3);
}

.slider-wrapper { display: flex; align-items: center; gap: 8px; }

.slider {
  flex: 1; height: 5px; -webkit-appearance: none; appearance: none;
  background: var(--border); border-radius: 3px; outline: none; cursor: pointer;
}

.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 13px; height: 13px; background: var(--blue); border-radius: 50%; cursor: pointer;
}

.slider::-moz-range-thumb {
  width: 13px; height: 13px; background: var(--blue);
  border-radius: 50%; cursor: pointer; border: none;
}

.slider-value {
  min-width: 35px; text-align: right; font-size: 12px;
  color: var(--text-3); font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

#master-waveform-graph {
  align-self: flex-start;
  width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255,255,255,.03);
  overflow: hidden;
}

#master-waveform-graph[hidden] {
  display: none;
}

#master-waveform-canvas {
  display: block;
  width: 100%;
  height: auto;
}

/* Level Meters (master) */
.level-meters {
  display: flex; flex-direction: row; gap: 3px;
  width: 23px; height: 50px; flex-shrink: 0;
}

.meter-track {
  flex: 1; height: 100%;
  background: rgba(255,255,255,.06); border-radius: 4px;
  overflow: hidden; position: relative;
}

.meter-bar {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
  background: linear-gradient(to top, var(--green), var(--amber), var(--red));
  background-size: 100% 50px; background-position: bottom center;
}

.meter-bar.clipping { background: var(--red); }

.version-footer { text-align: center; padding: 8px; font-size: 11px; color: var(--text-3); opacity: .5; }

/* ================================================================== */
/* PER-TRACK CONTROLS (Mixer)                                          */
/* ================================================================== */

.tracks-section h2 {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-3); margin-bottom: var(--spacing);
}

.tracks-container { display: flex; flex-direction: column; gap: 8px; }

/* ---- Track row ---- */
.track-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 11px;
  transition: opacity .2s, background .2s, border-color .2s;
  position: relative;
}

/* Solo: blue tint */
.track-row.row-soloed {
  background: oklch(0.72 0.14 240 / .07);
  border-color: oklch(0.72 0.14 240 / .4);
}

/* Muted: faded */
.track-row.row-muted { opacity: .55; }

/* Voice color stripe — 4px left border indicator */
.track-voice-stripe {
  width: 4px;
  align-self: stretch;
  border-radius: 2px;
  flex-shrink: 0;
  min-height: 28px;
}

/* Track name */
.track-name {
  font-weight: 700; color: var(--text); font-size: 15px;
  min-width: 80px; max-width: 120px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Spacer pushes controls to center */
.track-spacer { flex: 1; }

/* ---- Segmented controls ---- */
.segmented-control {
  display: inline-flex;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
}

/* Level & Pan buttons — use segmented style */
.btn-level, .btn-pan {
  min-width: 32px; height: 28px; padding: 0 6px;
  background: transparent; color: var(--text-3);
  border: none; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace; letter-spacing: .3px;
  transition: all .15s;
  display: inline-flex; align-items: center; justify-content: center;
}

.btn-level:hover, .btn-pan:hover { color: var(--text); background: var(--surface-3); }

/* Active states */
.btn-level.active-mute {
  background: var(--red-bg); color: var(--red);
  box-shadow: 0 0 0 1px var(--red), 0 2px 6px oklch(0.72 0.18 25 / .3);
}

.btn-level.active-low {
  background: oklch(0.72 0.14 240 / .15); color: var(--blue);
  box-shadow: 0 0 0 1px var(--blue), 0 2px 6px oklch(0.72 0.14 240 / .3);
}

.btn-level.active-medium {
  background: oklch(0.78 0.14 70 / .15); color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 2px 6px oklch(0.78 0.14 70 / .3);
}

.btn-level.active-normal {
  background: oklch(0.72 0.16 155 / .15); color: var(--green);
  box-shadow: 0 0 0 1px var(--green), 0 2px 6px oklch(0.72 0.16 155 / .3);
}

.btn-pan.active {
  background: oklch(0.72 0.14 240 / .15); color: var(--blue);
  box-shadow: 0 0 0 1px var(--blue), 0 2px 6px oklch(0.72 0.14 240 / .3);
}

/* S / M letter buttons */
.track-sm-btn {
  width: 34px; height: 30px; border-radius: 7px;
  background: var(--surface-3); border: 1px solid var(--border-strong);
  color: var(--text-2); font-size: 12px; font-weight: 800;
  font-family: inherit; cursor: pointer; letter-spacing: .5px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s;
}

.track-sm-btn:hover { color: var(--text); border-color: var(--text-3); }

/* Solo active */
.track-solo[aria-pressed="true"] {
  background: var(--blue-bg); border-color: var(--blue); color: var(--blue);
}

/* Mute active */
.track-mute-btn.mute-active {
  background: var(--red-bg); border-color: var(--red); color: var(--red);
}

/* Activity bar (inline LED meter) */
.track-activity-bar {
  display: flex; flex-direction: column-reverse; gap: 2px;
  width: 5px; height: 32px; flex-shrink: 0;
}

.activity-segment { flex: 1; border-radius: 1px; background: rgba(255,255,255,.06); }
.activity-segment.on-low    { background: oklch(0.72 0.16 155); }
.activity-segment.on-mid    { background: oklch(0.78 0.18 80); }
.activity-segment.on-high   { background: oklch(0.7  0.20 30); }

/* Track meter (L/R animated bars) */
.track-meter {
  flex-shrink: 0; width: 14px; height: 34px;
  display: flex; flex-direction: row; gap: 2px;
}

.track-meter .meter-track { flex: 1; height: 100%; }

.track-meter .meter-bar {
  background: linear-gradient(to top, var(--green), var(--amber), var(--red));
}

/* Track controls group wrappers */
.track-controls-group { display: flex; flex-direction: row; gap: 6px; align-items: center; }
.track-level-group { flex-shrink: 0; }
.track-pan-group   { flex-shrink: 0; }
.track-actions     { display: flex; align-items: center; gap: 6px; }
.track-mix-line2 {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  width: 100%;
}

/* width:100% above belongs to the wrapped layouts, where mix-line2 really is a full-width second
   line. On a single-line row it is just a wrapper around the level and pan groups, and stretching
   it across the row leaves the level/pan buttons at its left edge while everything after it — S, M
   and the meter — is shoved against the row's right edge (atc-c1m). */
.track-row:not(.compact) .track-mix-line2 { width: auto; }

/* Overflow fallback (all breakpoints):
   1) compact: wrap level/pan below before shrinking track name
   2) compact-tight: only then allow name to shrink harder */
.track-row.compact {
  flex-wrap: wrap;
  gap: 8px;
}

.track-row.compact .track-spacer {
  display: none;
}

.track-row.compact .track-level-group {
  flex: 1;
  justify-content: flex-start;
}

.track-row.compact .track-pan-group {
  flex-shrink: 0;
  justify-content: flex-end;
}

.track-row.compact .track-mix-line2 {
  order: 10;
  flex: 0 0 100%;
  width: 100%;
}

.track-row.compact .track-name {
  flex: 1;
  min-width: 120px;
  max-width: none;
}

.track-row.compact-tight .track-name {
  min-width: 0;
}

/* Desktop: single-line layout with spacer */
@media (min-width: 600px) {
  .track-row {
    flex-wrap: nowrap;
  }

  .track-name { min-width: 100px; max-width: 140px; }
}

/* Mobile: two-line layout */
@media (max-width: 599px) {
  .track-row {
    flex-wrap: wrap;
    padding: 10px 12px;
    gap: 8px;
  }

  .track-voice-stripe { align-self: stretch; }

  .track-name {
    /* Keep meaningful name width first; only compact-tight may collapse further. */
    flex: 1; min-width: 120px; max-width: none; font-size: 15px;
  }

  /* Line 1: stripe + name + S + M + meter */
  .track-sm-btn { order: 2; }
  .track-actions { order: 3; }
  .track-spacer  { display: none; }
  .track-mix-line2 { order: 10; flex: 0 0 100%; width: 100%; }

  /* Line 2: level + pan — side by side, level grows to fill, pan stays right */
  .track-level-group { flex: 1; justify-content: flex-start; }
  .track-pan-group   { flex-shrink: 0; justify-content: flex-end; }
}

/* ================================================================== */
/* ICON BUTTON (generic)                                               */
/* ================================================================== */

.icon-btn {
  width: 40px; height: 40px; min-height: 40px; min-width: 40px; padding: 0;
  border: 1px solid var(--border-strong); background: var(--surface-2);
  color: var(--text-2); border-radius: 8px; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: all .2s;
  font-family: inherit;
}

.icon-btn:hover { border-color: var(--text-3); color: var(--text); }

.icon-btn[aria-pressed="true"] {
  background: var(--blue-bg); border-color: var(--blue); color: var(--blue);
}

/* ================================================================== */
/* EXPORT SECTION                                                      */
/* ================================================================== */

.export-section h2 {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-3); margin-bottom: var(--spacing);
}

.export-controls {
  display: flex; flex-direction: column; gap: var(--spacing-sm); margin-bottom: var(--spacing);
}

@media (min-width: 800px) { .export-controls { flex-direction: row; gap: var(--spacing); } }

.input {
  padding: 10px; border: 1px solid var(--border-strong);
  border-radius: 8px; background: var(--surface-1); color: var(--text);
  font-size: 14px; transition: border-color .2s; font-family: inherit;
}

.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--blue); }

@media (min-width: 800px) { .input { flex: 1; } }

.export-buttons { display: flex; gap: var(--spacing-sm); }

@media (min-width: 600px) { .export-buttons { gap: var(--spacing); } }

/* ================================================================== */
/* FOLDER PICKER MODAL                                                 */
/* ================================================================== */

.folder-picker {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1000; display: flex; align-items: center; justify-content: center;
}

.folder-picker.hidden { display: none !important; }

.picker-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.7);
}

.picker-dialog {
  position: relative; background: var(--surface-1); border-radius: var(--radius);
  width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,.6); border: 1px solid var(--border-strong); z-index: 1001;
}

.picker-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--spacing); border-bottom: 1px solid var(--border);
}

.picker-header h3 { margin: 0; font-size: 16px; color: var(--text); }

.picker-breadcrumb {
  padding: var(--spacing-sm) var(--spacing); font-size: 13px;
  color: var(--text-3); border-bottom: 1px solid var(--border);
}

.picker-body { padding: var(--spacing); }

.picker-label { display: block; font-size: 14px; color: var(--text-2); margin-bottom: var(--spacing-sm); }

.picker-input-row { display: flex; gap: var(--spacing-sm); }
.picker-input-row .input { flex: 1; }

.folder-item, .file-item {
  padding: 10px; margin-bottom: 6px; background: var(--surface-2);
  border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-2);
  transition: all .2s; border: 1px solid transparent;
}

.folder-item:hover, .file-item:hover {
  background: var(--blue); color: var(--bg); border-color: var(--blue);
}

.file-item.selected { background: var(--blue); color: var(--bg); }

/* ================================================================== */
/* STATUS MESSAGES                                                     */
/* ================================================================== */

.status-message {
  padding: var(--spacing-sm) var(--spacing); border-radius: 6px;
  margin-top: var(--spacing); font-size: 13px; display: none;
}

.status-message:not(:empty) { display: block; }

.status-message.success  { background: oklch(0.72 0.16 155 / .1); color: #7ee8a2; border: 1px solid oklch(0.72 0.16 155 / .3); }
.status-message.error    { background: oklch(0.72 0.18 25  / .1); color: #f1948a; border: 1px solid oklch(0.72 0.18 25  / .3); }
.status-message.warning  { background: oklch(0.78 0.14 70  / .1); color: #f3c06e; border: 1px solid oklch(0.78 0.14 70  / .3); }
.status-message.info     { background: oklch(0.72 0.14 240 / .1); color: #85b8e8; border: 1px solid oklch(0.72 0.14 240 / .3); }

/* ================================================================== */
/* CLOSE BUTTON                                                        */
/* ================================================================== */

.btn-close {
  width: 32px; height: 32px; min-height: 32px; padding: 0;
  background: transparent; color: var(--text-3); font-size: 18px;
  border: 1px solid transparent; border-radius: 6px; font-family: inherit; cursor: pointer;
}

.btn-close:hover { background: var(--surface-2); color: var(--text); transform: none; box-shadow: none; }

/* ================================================================== */
/* STICKY MOBILE CTA (play-selected wrapping)                          */
/* ================================================================== */

.sticky-cta {
  position: sticky; bottom: 0;
  padding: 12px 0;
  background: linear-gradient(180deg, transparent, var(--bg) 28%);

/* ================================================================== */
/* UTILITY                                                             */
/* ================================================================== */

.hidden { display: none !important; }
.text-center { text-align: center; }
.text-muted { color: var(--text-3); }

<script>
/**

 * See LICENSE file for details.
 */

/**
 * Build-time placeholders. The publisher rewrites these four literals; unbuilt, they stay null
 * and the page still runs — which is the point. A config file would have to be fetched before
 * first paint, and fetching a file to find out where to fetch files from is the round trip this
 * whole migration exists to remove.
 */
var STATIC_BUILD_VERSION_ = "1.6.7.8";
var STATIC_ENV_LABEL_ = "TEST";
var STATIC_WEBAPP_URL_ = "https://script.google.com/macros/s/AKfycbx6AZF5KKUi9HXM9oS2mMD0jtV25k5Fs21JqSSBM_v4U9Z8caHmMazdwhXyMD-4Agak/exec";
var STATIC_BUILD_DATE_ = "2026-08-23T21:30:28.458Z";

/**
 * The stamp the sessionStorage folder cache is scoped by (atc-79j). On the HtmlService page this
 * is BUILD_INFO.buildDate out of version.html; here the publisher stamps STATIC_BUILD_DATE_.
 *
 * Unbuilt there is no deploy to scope against, so the stamp is this page load. That keeps the
 * guarantee the scoping exists for — a cached listing can never outlive the build it came from —
 * instead of falling back to one shared literal that every build would share. The cost is that a
 * local reload starts a fresh cache, which is the right trade for a page being edited.
 */
var STATIC_BUILD_STAMP_ = STATIC_BUILD_DATE_ || ('local-' + Date.now().toString(36));

/**
 * Where the API lives. Unbuilt (STATIC_WEBAPP_URL_ === null) a `?webapp=` parameter supplies it
 * and is remembered, so a local server can be pointed at any deployment for a session without
 * editing the source — that is how this page is developed and how the Playwright suite drives
 * it. A built page ignores both: its URL is stamped in.
 */
function resolveWebappUrl_() {
  if (STATIC_WEBAPP_URL_) return STATIC_WEBAPP_URL_;
  try {
    var fromQuery = new URLSearchParams(window.location.search).get('webapp');
    if (fromQuery) {
      window.sessionStorage.setItem('pmix.webappUrl', fromQuery);
      return fromQuery;
    }
    return window.sessionStorage.getItem('pmix.webappUrl');
  } catch (e) {
    return null;
  }
}

/**
 * The single RPC path. Replaces all six google.script.run call sites: a `text/plain` POST is a
 * CORS *simple* request, so it reaches cmd=api with no preflight — which matters because Apps
 * Script cannot answer an OPTIONS request at all (PMIX-PLAN P0).
 *
 * Returns the server function's own return value, so every existing `result.error` check reads
 * exactly as it did under the old RPC. A transport failure, an unknown action or a denial
 * throws instead, landing in the try/catch the call sites already have.
 *
 * D5: this posts `{action, ...args}` and nothing else — no ID token, and the page has no sign-in
 * flow. **P6's seam is the payload literal below**: that is the one place a token gets added.
 */
async function callApi(action, args) {
  var url = resolveWebappUrl_();
  if (!url) {
    throw new Error('No web app URL configured — append ?webapp=<deployment /exec URL> or publish a built page.');
  }

  var payload = Object.assign({ action: action }, args || {});

  var response;
  try {
    response = await fetch(url + (url.indexOf('?') === -1 ? '?' : '&') + 'cmd=api', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    throw new Error('Could not reach the server (' + (e && e.message ? e.message : e) + ')');
  }

  var text = await response.text();
  var body;
  try {
    body = JSON.parse(text);
  } catch (e) {
    // Non-JSON means the request never reached the cmd=api handler — nearly always a deployment
    // mid-propagation serving an older build. Naming it beats "unexpected token <".
    throw new Error('Server returned a non-JSON response (HTTP ' + response.status + ') — the deployment may be mid-propagation.');
  }

  if (!body.ok) throw new Error('Server rejected the request: ' + (body.error || 'unknown error'));
  return body.result;
}

/**
 * Build identity. The HtmlService page gets this stamped into version.html at deploy time; here
 * it comes from the placeholders, and unbuilt it says so rather than claiming a version it does
 * not have.
 */
const BUILD_INFO = {
  version: STATIC_BUILD_VERSION_ || 'unbuilt (local)',
  buildDate: STATIC_BUILD_STAMP_,
  target: STATIC_ENV_LABEL_ || 'LOCAL'
};
</script>

<script>
/**
 * wsola.js — Waveform Similarity Overlap-Add time stretching
 *
 * Stretches or compresses an audio buffer in time without changing pitch.
 * Uses WSOLA: for each output block the best-matching input position is found
 * via cross-correlation within a search window, then overlap-added with a
 * Hanning window to eliminate discontinuities.
 *
 * Parameters tuned to SoundTouch defaults (82 / 28 / 12 ms).
 *
 * Copyright (c) 2026 Stuart Donaldson. Licensed under MIT License.
 */

/**
 * @param {Float32Array} input     - mono PCM samples
 * @param {number}       rate      - tempo ratio (e.g. 1.2 = 20 % faster, same pitch)
 * @param {number}       sampleRate
 * @returns {Float32Array}         - time-stretched mono PCM
 */
function wsola(input, rate, sampleRate) {
  const inputLen = input.length;
  const outputLen = Math.round(inputLen / rate);

  if (Math.abs(rate - 1.0) < 1e-6) {
    const copy = new Float32Array(outputLen);
    copy.set(input.subarray(0, outputLen));
    return copy;
  }

  // Block sizes derived from SoundTouch defaults (ms → samples)
  const overlapSamples = Math.round(0.012 * sampleRate);          // 12 ms
  const seekSamples    = Math.round(0.028 * sampleRate);          // 28 ms
  const blockSamples   = Math.round(0.082 * sampleRate);          // 82 ms
  const stepSamples    = blockSamples - overlapSamples;

  // Pre-compute Hanning window over the overlap zone
  const hanning = new Float32Array(overlapSamples);
  for (let i = 0; i < overlapSamples; i++) {
    hanning[i] = 0.5 * (1 - Math.cos(Math.PI * i / (overlapSamples - 1)));
  }

  const output  = new Float32Array(outputLen);
  // Accumulated overlap-add weight (for normalisation at boundaries)
  const weights = new Float32Array(outputLen);

  let outPos = 0;
  // Prev block tail used for cross-correlation search
  let prevBlockEnd = new Float32Array(overlapSamples);

  while (outPos + blockSamples <= outputLen) {
    // Nominal read position in the input
    const nomInPos = Math.round(outPos * rate);

    // Search for best cross-correlation match within ±seekSamples of nomInPos
    const searchStart = Math.max(overlapSamples, nomInPos - seekSamples);
    const searchEnd   = Math.min(inputLen - blockSamples, nomInPos + seekSamples);

    let bestPos = nomInPos;
    if (searchEnd > searchStart && outPos > 0) {
      let bestCorr = -Infinity;
      for (let s = searchStart; s <= searchEnd; s++) {
        let corr = 0;
        for (let k = 0; k < overlapSamples; k++) {
          corr += prevBlockEnd[k] * input[s + k];
        }
        if (corr > bestCorr) {
          bestCorr = corr;
          bestPos  = s;
        }
      }
    }

    // Clamp to valid range
    bestPos = Math.max(0, Math.min(inputLen - blockSamples, bestPos));

    // Overlap-add: first overlapSamples fade in/out with Hanning
    for (let k = 0; k < overlapSamples; k++) {
      const o = outPos + k;
      if (o >= outputLen) break;
      const fadeIn  = hanning[k];
      const fadeOut = hanning[overlapSamples - 1 - k];
      output[o]  += fadeIn * input[bestPos + k] + fadeOut * prevBlockEnd[k];
      weights[o] += 1.0;
    }

    // Non-overlapping body — just copy
    const bodyStart = outPos + overlapSamples;
    const bodyLen   = stepSamples;
    for (let k = 0; k < bodyLen; k++) {
      const o = bodyStart + k;
      if (o >= outputLen) break;
      output[o]  += input[bestPos + overlapSamples + k];
      weights[o] += 1.0;
    }

    // Save the tail of this block for the next iteration's cross-correlation
    const tailStart = bestPos + blockSamples - overlapSamples;
    for (let k = 0; k < overlapSamples; k++) {
      prevBlockEnd[k] = tailStart + k < inputLen ? input[tailStart + k] : 0;
    }

    outPos += stepSamples;
  }

  // Fill any remaining samples by linear interpolation from the input
  for (let o = outPos; o < outputLen; o++) {
    const inIdx = Math.min(inputLen - 1, Math.round(o * rate));
    output[o] = input[inIdx];
  }

  // Normalise overlap-add regions
  for (let o = 0; o < outputLen; o++) {
    if (weights[o] > 1.0) output[o] /= weights[o];
  }

  return output;
}

if (typeof module !== 'undefined') {
  module.exports = { wsola };
}

<script>
const VolumeMapping = (() => {
  // The minimum amplitude in dB. Keep a deep floor at -60 dB for quiet tail-off.
  const MASTER_DB_MIN = -60;
  const MASTER_DB_MAX = 0;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function dbToGain(db) {
    return Math.pow(10, db / 20);
  }

  function gainToDb(gain) {
    return 20 * Math.log10(Math.max(1e-8, gain));
  }

  function sliderValueToDb(sliderValue, minDb = MASTER_DB_MIN, maxDb = MASTER_DB_MAX) {
    const normalized = clamp(sliderValue, 0, 100) / 100;
    return minDb + normalized * (maxDb - minDb);
  }

  function sliderValueToGain(sliderValue, minDb = MASTER_DB_MIN, maxDb = MASTER_DB_MAX) {
    return dbToGain(sliderValueToDb(sliderValue, minDb, maxDb));
  }

  // Map a 0-100 slider value to a perceived-loudness percentage (0-100).
  // This exposes a linear readout for the UI while the underlying mapping
  // remains in dB/gain space. Percent = (dB - minDb) / (maxDb - minDb) * 100
  function sliderValueToPerceivedPercent(sliderValue, minDb = MASTER_DB_MIN, maxDb = MASTER_DB_MAX) {
    const db = sliderValueToDb(sliderValue, minDb, maxDb);
    const pct = ((db - minDb) / (maxDb - minDb)) * 100;
    return clamp(Math.round(pct), 0, 100);
  }

  function gainToPerceivedPercent(gain, minDb = MASTER_DB_MIN, maxDb = MASTER_DB_MAX) {
    const db = gainToDb(gain);
    const pct = ((db - minDb) / (maxDb - minDb)) * 100;
    return clamp(Math.round(pct), 0, 100);
  }

  // Linear 0..1 perceived loudness helpers for direct UI display.
  function sliderValueToPerceivedLinear(sliderValue, minDb = MASTER_DB_MIN, maxDb = MASTER_DB_MAX) {
    // For UI display we want a linear perceived value (0..1) matching the slider.
    const normalized = clamp(sliderValue, 0, 100) / 100;
    return normalized;
  }

  function gainToPerceivedLinear(gain, minDb = MASTER_DB_MIN, maxDb = MASTER_DB_MAX) {
    return gainToPerceivedPercent(gain, minDb, maxDb) / 100;
  }

  return {
    MASTER_DB_MIN,
    MASTER_DB_MAX,
    dbToGain,
    gainToDb,
    sliderValueToDb,
    sliderValueToGain,
    sliderValueToPerceivedPercent,
    gainToPerceivedPercent,
    sliderValueToPerceivedLinear,
    gainToPerceivedLinear,
    // Compute a gain such that perceived loudness (power) is linear between
    // the floor (MIN_DB) and full scale. This keeps a -60dB floor while making
    // the slider perceptually linear (center ≈ 0.5 perceived).
    sliderValueToGainPerceived(sliderValue = 100, minDb = MASTER_DB_MIN) {
      const s = clamp(sliderValue, 0, 100) / 100;
      const floorGain = dbToGain(minDb);
      const floorPower = floorGain * floorGain;
      const desiredPower = floorPower + s * (1 - floorPower);
      return Math.sqrt(desiredPower);
    },
    // Log/dB taper mapping: maps slider x∈[0,100] to gain using a dB range R.
    // Formula: db = (x_normalized * R) - R  -> gain = 10^(db/20)
    // Example: R=60 => x=0.5 -> db = -30 dB
    sliderValueToGainLogRange(sliderValue = 100, rangeDb = 60) {
      const s = clamp(sliderValue, 0, 100) / 100;
      const db = (s * rangeDb) - rangeDb;
      return dbToGain(db);
    },
    gainToSliderValueLogRange(gain, rangeDb = 60) {
      const db = gainToDb(gain);
      const s = (db + rangeDb) / rangeDb;
      return clamp(Math.round(s * 100), 0, 100);
    },
    // Compute gamma such that gain(0.5) == 10^(targetDb/20)
    computeGammaForTargetDb(targetDb) {
      const targetGain = dbToGain(targetDb);
      return Math.log(targetGain) / Math.log(0.5);
    },

    // Gamma mapping: gain = s^gamma  where s = sliderNormalized(0..1)
    sliderValueToGainGamma(sliderValue = 100, gamma = 0.5) {
      const s = clamp(sliderValue, 0, 100) / 100;
      return Math.pow(s, gamma);
    },

    gainToSliderValueGamma(gain, gamma = 0.5) {
      const g = Math.max(0, gain);
      return clamp(Math.round(Math.pow(g, 1 / Math.max(1e-9, gamma)) * 100), 0, 100);
    },
    // Invert sliderValueToGainPerceived: given a gain, return slider value 0..100
    gainToSliderValuePerceived(gain, minDb = MASTER_DB_MIN) {
      const g = Math.max(0, gain);
      const desiredPower = g * g;
      const floorGain = dbToGain(minDb);
      const floorPower = floorGain * floorGain;
      const s = (desiredPower - floorPower) / (1 - floorPower);
      return clamp(Math.round(s * 100), 0, 100);
    },
  };
})();

if (typeof module !== 'undefined') {
  module.exports = { VolumeMapping };
}
